<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16233A">
<title>Household Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233A;--muted:#556176;--paper:#EDF0EC;--card:#fff;--line:#D6DBD4;
  --good:#2E7D6F;--brass:#9A6B3F;--alert:#8C5B57;--soft:#F7F8F5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{font-family:'Archivo',system-ui,-apple-system,sans-serif;color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit}
button{touch-action:manipulation}
#app{max-width:1120px;margin:auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1.5px solid var(--ink)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Newsreader',Georgia,serif;font-size:31px;font-weight:400;line-height:1.1;margin:4px 0 0}
.sync{text-align:right}.sync span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.sync strong{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--good)}

.tabs{display:flex;gap:2px;margin:16px 0;flex-wrap:wrap}
.tab{font-size:13px;padding:9px 14px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
@media(max-width:520px){.cards{grid-template-columns:1fr}}

.panel-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between;gap:8px}
.hero{border-top:3px solid var(--good)}
.hero-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-num{font-family:'IBM Plex Mono',monospace;font-size:clamp(42px,10vw,64px);font-weight:600;line-height:1;color:var(--good);font-variant-numeric:tabular-nums;margin:8px 0}
.hero-num.short{color:var(--alert)}
.hero-sub{font-size:13px;color:var(--muted);margin:0}
.callout{margin-top:13px;padding:10px 12px;background:var(--soft);border-left:3px solid var(--good);font-size:13px}
.callout.bad{border-left-color:var(--alert)}
.callout.brass{border-left-color:var(--brass)}

.metric{background:#fff;border:1px solid var(--line);border-top:3px solid var(--good);padding:14px}
.metric.brass{border-top-color:var(--brass)}.metric.bad{border-top-color:var(--alert)}
.metric-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.metric-num{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;margin:4px 0 5px;font-variant-numeric:tabular-nums}
.metric p{font-size:11.5px;color:var(--muted);margin:0}

.cycle{background:#fff;border:1px solid var(--line);padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.cycle strong{font-family:'Newsreader',Georgia,serif;font-size:22px}.cycle span{font-size:12px;color:var(--muted)}

.row{display:flex;gap:12px;flex-wrap:wrap}.row>.field{flex:1 1 160px}
.field{display:block;margin-bottom:12px}.field-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.field-hint{font-size:11.5px;color:var(--muted);margin-top:4px;display:block}
input,select{width:100%;font-family:'IBM Plex Mono',monospace;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:2px;background:#FBFCFA;color:var(--ink)}
input[type=text]{font-family:'Archivo',sans-serif}

.btn{font-size:14px;font-weight:500;padding:11px 18px;background:var(--ink);color:#fff;border:0;border-radius:2px;cursor:pointer}
.link{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:3px 6px}

table{width:100%;border-collapse:collapse;font-size:13.5px}td{padding:8px 4px;border-bottom:1px solid #EBEEE9;vertical-align:top}
.td-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;width:1%}.td-num{font-family:'IBM Plex Mono',monospace;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.td-good{color:var(--good);font-weight:600}.td-x{text-align:right;width:1%}.tr-total td{border-top:1px solid var(--line);border-bottom:0;font-weight:600;padding-top:10px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--line);color:var(--muted);padding:1px 4px;border-radius:2px}.badge.brass{border-color:var(--brass);color:var(--brass)}

.progress{height:9px;background:#D8DDD7;overflow:hidden;border-radius:2px;margin:10px 0 7px}.progress i{display:block;height:100%;background:var(--good)}.progress i.over{background:var(--alert)}

.note{background:#FFF6E6;border:1px solid #E3CFA3;padding:10px 12px;border-radius:2px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}.note.bad{background:#F7EFEE;border-color:#D9BAB6}
.muted{color:var(--muted);font-size:13px}.small{font-size:11.5px}.empty{background:#fff;border:1px dashed var(--line);padding:38px 20px;text-align:center;color:var(--muted)}

.year-head{display:flex;justify-content:space-between;align-items:center}.year-title{font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:400;margin:0}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}@media(max-width:900px){.months{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.months{grid-template-columns:1fr}}
.month{background:#fff;border:1px solid var(--line);padding:12px}.month h3{font-family:'Newsreader',Georgia,serif;font-size:15px;margin:0 0 8px}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}.dow span{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#9AA39A;text-align:center}.day{position:relative;aspect-ratio:1;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.day-n{font-family:'IBM Plex Mono',monospace;font-size:10.5px}.day-today{background:var(--ink)}.day-today .day-n{color:#fff}.day-picked{outline:1.5px solid var(--ink)}.day-cycle:before{content:"";position:absolute;top:1px;left:3px;right:3px;height:2px;background:var(--good)}.marks{display:flex;gap:1.5px;height:5px;margin-top:2px}.dot{width:4.5px;height:4.5px;border-radius:50%;background:var(--good);display:inline-block}.bar{width:7px;height:2px;background:var(--alert);display:inline-block}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading shared ledger…</div></div>
<script>
"use strict";

/* =========================================================
   FIXED HOUSEHOLD BUDGET
   These are built into the app and are not user-configurable.
   ========================================================= */
const BILLS=[
 {id:"rent",name:"Rent",dueDay:1,amount:1972},
 {id:"youtube",name:"Youtube Music",dueDay:13,amount:30},
 {id:"googleone",name:"Google One (Photos)",dueDay:30,amount:10},
 {id:"disney",name:"Disney+",dueDay:16,amount:10},
 {id:"peacock",name:"Peacock",dueDay:27,amount:2},
 {id:"appletv",name:"Apple TV",dueDay:8,amount:13},
 {id:"netflix",name:"Netflix",dueDay:1,amount:20},
 {id:"hulu",name:"Hulu",dueDay:4,amount:2.15},
 {id:"hbo",name:"HBO",dueDay:24,amount:3},
 {id:"paramount",name:"Paramount",dueDay:17,amount:9},
 {id:"internet",name:"Internet (Cox)",dueDay:17,amount:70},
 {id:"electric",name:"Electric (SRP)",dueDay:18,amount:220,estimate:true},
 {id:"phone",name:"Phone (Google Fi)",dueDay:25,amount:100},
 {id:"renter",name:"Renter Insurance (SF)",dueDay:8,amount:10},
 {id:"water",name:"Water/Trash/Sewer (CoC)",dueDay:8,amount:90},
 {id:"life",name:"Life Insurance",dueDay:19,amount:127},
 {id:"gymnastics",name:"Gymnastics",dueDay:20,amount:245},
 {id:"swimming",name:"Swimming",dueDay:1,amount:0,estimate:true},
 {id:"529",name:"Fidelity 529 College",dueDay:5,amount:100},
 {id:"retirement",name:"Retirement",dueDay:2,amount:0,estimate:true},
 {id:"studentloan",name:"Student Loan",dueDay:15,amount:365}
];

const BUCKETS=[
 {id:"gas",name:"Gas",amount:120},
 {id:"costco",name:"Costco / House",amount:300},
 {id:"extras",name:"Budgeted Extras",amount:500},
 {id:"food",name:"Food",amount:600}
];

const BUCKET_TOTAL=BUCKETS.reduce((s,b)=>s+b.amount,0);

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((b-a)/86400000);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const monthLen=(y,m)=>new Date(y,m+1,0).getDate();
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["S","M","T","W","T","F","S"];
const fmtDate=d=>MON[d.getMonth()]+" "+d.getDate();
const fmtLong=d=>MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now()+Math.random().toString(36).slice(2,6);

const S={rev:0,ledger:null,tab:"cycle",note:null,noteBad:false,busy:false,year:today().getFullYear(),picked:null};

function blankLedger(){return{paychecks:[],draws:[],cycleAnchor:null}}

/* ---------- shared storage ---------- */
async function api(route,payload){
  try{
    const res=await fetch("/api/"+route,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload||{})});
    const text=await res.text();
    let data;try{data=JSON.parse(text)}catch{data={error:"The shared storage returned an unreadable response."}}
    return{ok:res.ok,status:res.status,data};
  }catch{return{ok:false,status:0,data:{error:"Couldn't reach the shared ledger."}}}
}

function normalize(raw){
  const oldConfig=raw.config||{};
  const oldLedger=Object.assign(blankLedger(),raw.ledger||{});
  if(!Array.isArray(oldLedger.paychecks))oldLedger.paychecks=[];
  if(!Array.isArray(oldLedger.draws))oldLedger.draws=[];

  // Migrate old bucket IDs to the new fixed IDs by name when possible.
  const oldAllowances=Array.isArray(oldConfig.allowances)?oldConfig.allowances:[];
  const oldNameById={};
  oldAllowances.forEach(a=>oldNameById[a.id]=String(a.name||"").toLowerCase());
  const canonical=name=>{
    const n=String(name||"").toLowerCase();
    if(n.includes("gas"))return"gas";
    if(n.includes("costco")||n.includes("house"))return"costco";
    if(n.includes("extra"))return"extras";
    if(n.includes("food"))return"food";
    return null;
  };
  oldLedger.draws=oldLedger.draws.map(d=>{
    if(BUCKETS.some(b=>b.id===d.allowanceId))return d;
    const mapped=canonical(oldNameById[d.allowanceId]);
    return mapped?Object.assign({},d,{allowanceId:mapped}):d;
  });

  if(!oldLedger.cycleAnchor){
    // First actual paycheck establishes the permanent 14-day rhythm.
    const dated=oldLedger.paychecks.filter(p=>p.date).slice().sort((a,b)=>parse(a.date)-parse(b.date));
    if(dated.length)oldLedger.cycleAnchor=dated[0].date;
  }
  return oldLedger;
}

async function load(quiet=false){
  const r=await api("load");
  if(!r.ok){S.note=r.data.error||"Couldn't reach the shared ledger.";S.noteBad=true;if(!quiet)render();return}
  S.rev=Number(r.data.rev||0);
  S.ledger=normalize(r.data||{});
  if(!quiet)render();
}

let saveTimer=null;
async function save(){
  S.busy=true;paintBusy();
  const fixedConfig={version:4,bills:BILLS,allowances:BUCKETS};
  const r=await api("save",{rev:S.rev,config:fixedConfig,ledger:S.ledger});
  S.busy=false;
  if(r.status===409){
    S.rev=Number(r.data.rev||0);S.ledger=normalize(r.data||{});
    S.note=r.data.message||"Someone else saved first. Your view was refreshed.";S.noteBad=true;render();return;
  }
  if(!r.ok){S.note=r.data.error||"That didn't save.";S.noteBad=true;render();return}
  S.rev=Number(r.data.rev||S.rev+1);paintBusy();
}
function commit(){render();clearTimeout(saveTimer);saveTimer=setTimeout(save,250)}
function paintBusy(){const e=document.getElementById("saveState");if(e)e.textContent=S.busy?"Saving…":"Saved"}

/* ---------- cycle math ---------- */
function cycleFor(date){
  if(!S.ledger.cycleAnchor)return null;
  const anchor=parse(S.ledger.cycleAnchor);
  const idx=Math.floor(dayDiff(anchor,date)/14);
  const start=addDays(anchor,idx*14);
  return{idx,start,end:addDays(start,14)};
}
function inCycle(dateISO,c){const d=parse(dateISO);return d>=c.start&&d<c.end}

function billsDue(start,end){
  const out=[];let cur=new Date(start.getFullYear(),start.getMonth(),1),guard=0;
  while(cur<end&&guard++<6){
    const len=monthLen(cur.getFullYear(),cur.getMonth());
    BILLS.forEach(b=>{
      const d=new Date(cur.getFullYear(),cur.getMonth(),Math.min(b.dueDay,len));
      if(d>=start&&d<end)out.push({date:d,bill:b});
    });
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out.sort((a,b)=>a.date-b.date);
}

function cycleData(c){
  const pays=S.ledger.paychecks.filter(p=>inCycle(p.date,c));
  const income=r2(pays.reduce((s,p)=>s+Number(p.amount||0),0));
  const due=billsDue(c.start,c.end);
  const billTotal=r2(due.reduce((s,x)=>s+x.bill.amount,0));
  return{cycle:c,pays,income,due,billTotal,available:r2(income-billTotal-BUCKET_TOTAL)};
}

function currentCycle(){
  if(!S.ledger.cycleAnchor)return null;
  return cycleFor(today());
}

function bucketData(c){
  return BUCKETS.map(b=>{
    const draws=S.ledger.draws.filter(d=>d.allowanceId===b.id&&inCycle(d.date,c));
    const spent=r2(draws.reduce((s,d)=>s+Number(d.amount||0),0));
    return{bucket:b,draws,spent,remaining:r2(b.amount-spent)};
  });
}

/* ---------- UI shell ---------- */
const app=document.getElementById("app");
function render(){
  if(!S.ledger){app.innerHTML='<div class="empty">Loading shared ledger…</div>';return}
  const tabs=[["cycle","Current cycle"],["buckets","Spending buckets"],["year","Year"]];
  app.innerHTML=
    '<header class="masthead"><div><div class="eyebrow">Household ledger</div><h1>Two-week budget</h1></div>'+
    '<div class="sync"><span>Shared ledger</span><strong id="saveState">'+(S.busy?"Saving…":"Saved")+'</strong></div></header>'+
    '<nav class="tabs">'+tabs.map(t=>'<button class="tab" aria-selected="'+(S.tab===t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>').join("")+'</nav>'+
    (S.note?'<div class="note '+(S.noteBad?'bad':'')+'"><span>'+esc(S.note)+'</span><button class="link" data-act="clearNote">Dismiss</button></div>':'')+
    '<main>'+(S.tab==="cycle"?viewCycle():S.tab==="buckets"?viewBuckets():viewYear())+'</main>'+
    '<footer class="foot"><span>Bills and bucket amounts are built into the app.</span><button class="link" data-act="reload">Reload shared data</button></footer>';
}

/* ---------- current cycle ---------- */
function paycheckForm(){
  return '<div class="row">'+
    '<label class="field"><span class="field-label">Exact paycheck amount</span><input type="number" step="0.01" inputmode="decimal" id="payAmount" placeholder="0.00"></label>'+
    '<label class="field"><span class="field-label">Date received</span><input type="date" id="payDate" value="'+iso(today())+'"></label>'+
    '</div>'+
    '<label class="field"><span class="field-label">Label (optional)</span><input type="text" id="payLabel" placeholder="Brooke paycheck, spouse paycheck, bonus…"><span class="field-hint">The amount is never projected or reused. Enter the exact deposit every time.</span></label>'+
    '<button class="btn" data-act="addPay">Add paycheck & recalculate</button>';
}

function viewCycle(){
  const c=currentCycle();
  if(!c){
    return '<section class="panel hero"><div class="hero-label">Ready to begin</div><div class="hero-num">$0.00</div>'+
      '<p class="hero-sub">Enter the first actual paycheck. Its date will automatically become the start of your repeating 14-day budget cycle.</p>'+
      '<div class="callout brass">After that, every paycheck can be a different amount. The app only uses amounts you actually enter.</div></section>'+
      '<div class="grid" style="margin-top:14px"><section class="panel"><h2 class="panel-title">Enter first paycheck</h2>'+paycheckForm()+'</section>'+
      '<section class="panel"><h2 class="panel-title">Already built in</h2>'+fixedSummary()+'</section></div>';
  }

  const d=cycleData(c);
  const positive=d.available>=0;
  const payRows=d.pays.slice().sort((a,b)=>parse(b.date)-parse(a.date)).map(p=>
    '<tr><td class="td-date">'+fmtDate(parse(p.date))+'</td><td>'+esc(p.streamName||p.label||"Paycheck")+'</td><td class="td-num td-good">'+money(p.amount)+'</td><td class="td-x"><button class="link" data-act="delPay" data-v="'+p.id+'">Remove</button></td></tr>'
  ).join("");

  const dueRows=d.due.map(x=>
    '<tr><td class="td-date">'+fmtDate(x.date)+'</td><td>'+esc(x.bill.name)+(x.bill.estimate?' <span class="badge brass">estimate</span>':'')+'</td><td class="td-num">'+money(x.bill.amount)+'</td></tr>'
  ).join("");

  return '<div class="cycle"><div><span>Current 14-day cycle</span><br><strong>'+fmtDate(c.start)+' – '+fmtDate(addDays(c.end,-1))+'</strong></div>'+
    '<span>Cycle automatically repeats every 14 days from '+fmtDate(parse(S.ledger.cycleAnchor))+'.</span></div>'+
    '<section class="panel hero"><div class="hero-label">'+(positive?'Safe to transfer to savings now':'Still needed to cover this cycle')+'</div>'+
    '<div class="hero-num '+(positive?'':'short')+'">'+money(Math.abs(d.available))+'</div>'+
    '<p class="hero-sub">'+money(d.income)+' actual income − '+money(d.billTotal)+' bills due − '+money(BUCKET_TOTAL)+' reserved buckets</p>'+
    '<div class="callout '+(positive?'':'bad')+'">'+
      (positive?'This is based only on paychecks actually entered. Add another paycheck and this number updates immediately.':
      'The paychecks entered so far do not yet cover all bills and the full two-week spending buckets.')+
    '</div></section>'+
    '<div class="cards">'+
      '<div class="metric"><div class="metric-label">Actual income</div><div class="metric-num">'+money(d.income)+'</div><p>'+d.pays.length+' deposit'+(d.pays.length===1?'':'s')+' entered</p></div>'+
      '<div class="metric bad"><div class="metric-label">Bills due</div><div class="metric-num">'+money(d.billTotal)+'</div><p>Automatically selected by due date</p></div>'+
      '<div class="metric brass"><div class="metric-label">Buckets reserved</div><div class="metric-num">'+money(BUCKET_TOTAL)+'</div><p>$120 Gas · $300 Costco · $500 Extras · $600 Food</p></div>'+
      '<div class="metric"><div class="metric-label">Cycle length</div><div class="metric-num">14 days</div><p>No paycheck amount assumptions</p></div>'+
    '</div>'+
    '<div class="grid">'+
      '<section class="panel"><h2 class="panel-title">Add paycheck <span>actual deposit only</span></h2>'+paycheckForm()+'</section>'+
      '<section class="panel"><h2 class="panel-title">Bills automatically reserved</h2><table><tbody>'+dueRows+
        '<tr class="tr-total"><td></td><td>Bills this cycle</td><td class="td-num">'+money(d.billTotal)+'</td></tr></tbody></table></section>'+
      '<section class="panel"><h2 class="panel-title">Paychecks entered this cycle</h2>'+
        (payRows?'<table><tbody>'+payRows+'</tbody></table>':'<p class="muted">No paychecks entered in this cycle yet.</p>')+'</section>'+
      '<section class="panel"><h2 class="panel-title">Fixed two-week buckets</h2>'+fixedBucketsTable()+
        '<p class="muted small">The full $1,520 is reserved before savings is calculated. Expenses only reduce the balance remaining inside each bucket.</p>'+
        '<button class="btn" data-act="tab" data-v="buckets">Enter bucket expense</button></section>'+
    '</div>';
}

function fixedSummary(){
  return '<p class="muted">The app already knows all 21 monthly bills and these four two-week buckets:</p>'+fixedBucketsTable()+
    '<p class="muted small">Total bucket reserve: <strong>'+money(BUCKET_TOTAL)+'</strong> every 14 days.</p>';
}
function fixedBucketsTable(){
  return '<table><tbody>'+BUCKETS.map(b=>'<tr><td>'+esc(b.name)+'</td><td class="td-num">'+money(b.amount)+'</td></tr>').join("")+
    '<tr class="tr-total"><td>Total</td><td class="td-num">'+money(BUCKET_TOTAL)+'</td></tr></tbody></table>';
}

/* ---------- bucket spending ---------- */
function viewBuckets(){
  const c=currentCycle();
  if(!c)return '<div class="empty">Enter your first paycheck before logging bucket spending. That paycheck starts the 14-day cycle.</div>';
  const data=bucketData(c);
  const cards=data.map(x=>{
    const pct=Math.max(0,Math.min(100,(x.remaining/x.bucket.amount)*100));
    return '<div class="metric '+(x.remaining<0?'bad':'')+'"><div class="metric-label">'+esc(x.bucket.name)+'</div><div class="metric-num">'+money(x.remaining)+'</div>'+
      '<div class="progress"><i class="'+(x.remaining<0?'over':'')+'" style="width:'+pct+'%"></i></div><p>'+money(x.spent)+' spent of '+money(x.bucket.amount)+'</p></div>';
  }).join("");
  const draws=S.ledger.draws.filter(d=>inCycle(d.date,c)).sort((a,b)=>parse(b.date)-parse(a.date));
  const bucketName=id=>{const b=BUCKETS.find(x=>x.id===id);return b?b.name:"Bucket"};

  return '<div class="cycle"><div><span>Current spending cycle</span><br><strong>'+fmtDate(c.start)+' – '+fmtDate(addDays(c.end,-1))+'</strong></div><span>Balances reset automatically with each 14-day cycle.</span></div>'+
    '<div class="cards">'+cards+'</div>'+
    '<div class="grid">'+
      '<section class="panel"><h2 class="panel-title">Enter expense</h2>'+
        '<div class="row"><label class="field"><span class="field-label">Bucket</span><select id="drawBucket">'+BUCKETS.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join("")+'</select></label>'+
        '<label class="field"><span class="field-label">Exact amount</span><input type="number" step="0.01" inputmode="decimal" id="drawAmount" placeholder="0.00"></label></div>'+
        '<div class="row"><label class="field"><span class="field-label">What for (optional)</span><input type="text" id="drawNote" placeholder="Groceries, gas station, Costco…"></label>'+
        '<label class="field"><span class="field-label">Date</span><input type="date" id="drawDate" value="'+iso(today())+'"></label></div>'+
        '<button class="btn" data-act="addDraw">Add expense</button></section>'+
      '<section class="panel"><h2 class="panel-title">Expenses this cycle</h2>'+
        (draws.length?'<table><tbody>'+draws.map(d=>'<tr><td class="td-date">'+fmtDate(parse(d.date))+'</td><td>'+esc(d.what||"Expense")+'<br><span class="muted small">'+esc(bucketName(d.allowanceId))+'</span></td>'+
        '<td class="td-num">'+money(d.amount)+'</td><td class="td-x"><button class="link" data-act="delDraw" data-v="'+d.id+'">Remove</button></td></tr>').join("")+'</tbody></table>':'<p class="muted">No bucket expenses entered this cycle yet.</p>')+
      '</section></div>';
}

/* ---------- yearly calendar ---------- */
function cycleStartsForYear(y){
  const out=new Set();if(!S.ledger.cycleAnchor)return out;
  const start=new Date(y,0,1),end=new Date(y+1,0,1),anchor=parse(S.ledger.cycleAnchor);
  let idx=Math.floor(dayDiff(anchor,start)/14),d=addDays(anchor,idx*14);
  while(d<start)d=addDays(d,14);
  while(d<end){out.add(iso(d));d=addDays(d,14)}
  return out;
}
function billsForYear(y){
  const map={};
  for(let m=0;m<12;m++){
    const len=monthLen(y,m);
    BILLS.forEach(b=>{
      const d=iso(new Date(y,m,Math.min(b.dueDay,len)));
      (map[d]=map[d]||[]).push(b);
    });
  }
  return map;
}
function viewYear(){
  const y=S.year,billMap=billsForYear(y),cycleSet=cycleStartsForYear(y),payMap={};
  S.ledger.paychecks.filter(p=>parse(p.date).getFullYear()===y).forEach(p=>(payMap[p.date]=payMap[p.date]||[]).push(p));
  const t=iso(today());
  let html='<section class="panel"><div class="year-head"><button class="link" data-act="year" data-v="'+(y-1)+'">← '+(y-1)+'</button><h2 class="year-title">'+y+'</h2><button class="link" data-act="year" data-v="'+(y+1)+'">'+(y+1)+' →</button></div>'+
    '<p class="muted small">Green line = start of a 14-day cycle · green dot = actual paycheck entered · red bar = bill due</p></section><div class="months">';
  for(let m=0;m<12;m++){
    const len=monthLen(y,m),lead=new Date(y,m,1).getDay();
    html+='<div class="month"><h3>'+MONTHS[m]+'</h3><div class="dow">'+DOW.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="days">';
    for(let i=0;i<lead;i++)html+='<span class="day"></span>';
    for(let d=1;d<=len;d++){
      const k=iso(new Date(y,m,d));
      html+='<button class="day '+(k===t?'day-today ':'')+(S.picked===k?'day-picked ':'')+(cycleSet.has(k)?'day-cycle ':'')+'" data-act="pick" data-v="'+k+'"><span class="day-n">'+d+'</span><span class="marks">'+
        (payMap[k]?'<i class="dot"></i>':'')+(billMap[k]?'<i class="bar"></i>':'')+'</span></button>';
    }
    html+='</div></div>';
  }
  html+='</div>';
  if(S.picked){
    const bills=billMap[S.picked]||[],pays=payMap[S.picked]||[];
    html+='<section class="panel"><h2 class="panel-title">'+fmtLong(parse(S.picked))+'</h2>'+
      pays.map(p=>'<p>Paycheck: <strong>'+money(p.amount)+'</strong> '+esc(p.streamName||p.label||"")+'</p>').join("")+
      bills.map(b=>'<p>'+esc(b.name)+' <span style="float:right">'+money(b.amount)+'</span></p>').join("")+
      (!bills.length&&!pays.length?'<p class="muted">Nothing recorded or due.</p>':'')+'</section>';
  }
  return html;
}

/* ---------- events ---------- */
const val=id=>{const e=document.getElementById(id);return e?e.value:""};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==="tab"){S.tab=v;render();return}
  if(act==="reload"){load();return}
  if(act==="clearNote"){S.note=null;S.noteBad=false;render();return}
  if(act==="year"){S.year=Number(v);S.picked=null;render();return}
  if(act==="pick"){S.picked=S.picked===v?null:v;render();return}

  if(act==="addPay"){
    const amount=Number(val("payAmount")||0),date=val("payDate")||iso(today()),label=(val("payLabel")||"Paycheck").trim();
    if(!(amount>0)){S.note="Enter the exact paycheck amount.";S.noteBad=true;render();return}
    if(!S.ledger.cycleAnchor)S.ledger.cycleAnchor=date;
    S.ledger.paychecks.unshift({id:uid("p"),date,amount:r2(amount),streamName:label});
    S.ledger.paychecks=S.ledger.paychecks.slice(0,600);
    S.note="Paycheck added. Bills, buckets, and savings have been recalculated.";S.noteBad=false;commit();return;
  }
  if(act==="delPay"){S.ledger.paychecks=S.ledger.paychecks.filter(p=>p.id!==v);commit();return}

  if(act==="addDraw"){
    const amount=Number(val("drawAmount")||0),date=val("drawDate")||iso(today());
    if(!(amount>0)){S.note="Enter the exact expense amount.";S.noteBad=true;render();return}
    S.ledger.draws.unshift({id:uid("d"),allowanceId:val("drawBucket"),date,amount:r2(amount),what:(val("drawNote")||"Expense").trim()});
    S.ledger.draws=S.ledger.draws.slice(0,1500);
    S.note="Expense added. The bucket balance has been updated.";S.noteBad=false;commit();return;
  }
  if(act==="delDraw"){S.ledger.draws=S.ledger.draws.filter(d=>d.id!==v);commit();return}
});

/* ---------- start ---------- */
(async function(){
  await load();
  setInterval(async()=>{
    if(S.busy||document.hidden)return;
    const before=S.rev;await load(true);if(S.rev!==before)render();
  },15000);
})();
</script>
