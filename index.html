<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --ink:#16233A; --ink-2:#4A5568; --paper:#EDF0EC; --card:#FFFFFF;
  --line:#D6DBD4; --good:#2E7D6F; --brass:#9A6B3F; --alert:#8C5B57;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; background:var(--paper);}
body{
  color:var(--ink); font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
#app{max-width:1120px; margin:0 auto; padding:20px 16px calc(40px + env(safe-area-inset-bottom));}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:3px;}

.masthead{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; padding-bottom:14px; border-bottom:1.5px solid var(--ink);}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2);}
.masthead h1{font-family:'Newsreader',Georgia,serif; font-weight:400; font-size:30px; line-height:1.1; margin:4px 0 0;}
.savings-chip{text-align:right;}
.savings-chip span{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2);}
.savings-chip strong{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--good); font-variant-numeric:tabular-nums;}

.tabs{display:flex; gap:2px; margin:16px 0; flex-wrap:wrap;}
.tab{font-family:'Archivo',sans-serif; font-size:13px; padding:9px 14px; border:1px solid var(--line); background:transparent; color:var(--ink-2); cursor:pointer; border-radius:2px;}
.tab[aria-selected="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start;}
.cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px;}
@media(max-width:900px){ .cards{grid-template-columns:repeat(2,1fr);} }
@media(max-width:820px){ .grid{grid-template-columns:1fr;} }

.panel{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:18px;}
.card{padding:14px; border-top:3px solid var(--good);}
.card-num{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; color:var(--good); font-variant-numeric:tabular-nums; margin:4px 0 8px; line-height:1;}
.panel-title{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); margin:0 0 14px; display:flex; justify-content:space-between; align-items:baseline; gap:8px;}

.verdict{border-top:3px solid var(--good);}
.verdict-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2);}
.verdict-num{font-family:'IBM Plex Mono',monospace; font-size:clamp(38px,9vw,54px); font-weight:600; line-height:1; letter-spacing:-.02em; color:var(--good); font-variant-numeric:tabular-nums; margin:6px 0 8px;}
.short{color:var(--alert) !important;}
.verdict-sub{font-size:13px; color:var(--ink-2); margin:0;}

.runway{margin:16px 0 4px;}
.runway-track{display:flex; height:10px; border-radius:2px; overflow:hidden; background:#D6D9D4;}
.runway-seg{height:100%;}
.runway-key,.legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:10px;}
.key-item{font-size:11.5px; color:var(--ink-2); display:inline-flex; align-items:center; gap:5px;}
.key-item b{font-family:'IBM Plex Mono',monospace; color:var(--ink); font-variant-numeric:tabular-nums;}
.key-item i{width:9px; height:9px; border-radius:2px; display:inline-block;}
.bill-key{background:var(--alert); width:9px; height:3px !important; border-radius:1px;}

.row{display:flex; gap:12px; flex-wrap:wrap;}
.row > .field{flex:1 1 150px;}
.field{display:block; margin-bottom:12px;}
.field-label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin-bottom:5px;}
.field-hint{display:block; font-size:11.5px; color:var(--ink-2); margin-top:4px; line-height:1.4;}
input,select{width:100%; font-family:'IBM Plex Mono',monospace; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:2px; background:#FBFCFA; color:var(--ink);}
input[type=text]{font-family:'Archivo',sans-serif;}
input[type=checkbox]{width:auto;}

.btn{font-family:'Archivo',sans-serif; font-size:14px; font-weight:500; padding:11px 18px; background:var(--ink); color:#fff; border:none; border-radius:2px; cursor:pointer; margin-top:4px;}
.btn[disabled]{background:#B7BDB6; cursor:not-allowed;}
.btn-lg{width:100%; padding:14px; font-size:15px; margin-top:16px;}
.link{background:none; border:none; color:var(--ink-2); font-family:'Archivo',sans-serif; font-size:12px; text-decoration:underline; cursor:pointer; padding:3px 6px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
td{padding:8px 4px; border-bottom:1px solid #EBEEE9; vertical-align:top;}
.td-date{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-2); white-space:nowrap; width:1%;}
.td-num{font-family:'IBM Plex Mono',monospace; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.td-good{color:var(--good); font-weight:600;}
.td-x{text-align:right; width:1%;}
.tr-total td{border-bottom:none; border-top:1px solid var(--line); font-weight:600; padding-top:10px;}
.tag{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--brass); border:1px solid var(--brass); border-radius:2px; padding:1px 4px; margin-left:6px;}
.inline-in{border:none !important; background:transparent !important; padding:3px !important; font-size:14px !important;}
.inline-num{text-align:right; max-width:100px;}
.inline-day{max-width:48px; text-align:right;}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); margin:6px 0;}

.muted{color:var(--ink-2); font-size:13px;}
.small{font-size:11.5px;}
.warn{background:#F7EFEE; border-left:3px solid var(--alert); padding:10px 12px; font-size:13px; margin:14px 0 0; color:#5C3B38;}
.note{background:#FFF6E6; border:1px solid #E3CFA3; padding:10px 12px; border-radius:2px; font-size:13px; margin-bottom:14px; display:flex; justify-content:space-between; gap:10px; align-items:center;}
.note-bad{background:#F7EFEE; border-color:#D9BAB6;}
.empty{background:var(--card); border:1px dashed var(--line); padding:40px 20px; text-align:center; color:var(--ink-2); border-radius:3px;}
.adder{border-top:1px solid var(--line); margin-top:16px; padding-top:14px;}

.gate{background:var(--card); border:1px solid var(--line); border-top:3px solid var(--ink); border-radius:3px; padding:28px; max-width:440px; margin:40px auto;}
.gate h1{font-family:'Newsreader',Georgia,serif; font-weight:400; font-size:26px; margin:4px 0 12px;}
.gate input{margin:14px 0 0;}

.year-head{display:flex; justify-content:space-between; align-items:center;}
.year-title{font-family:'Newsreader',Georgia,serif; font-weight:400; font-size:26px; margin:0;}
.months{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px;}
@media(max-width:900px){ .months{grid-template-columns:repeat(2,1fr);} }
@media(max-width:480px){ .months{grid-template-columns:1fr;} }
.month{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:12px;}
.month h3{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:15px; margin:0 0 8px;}
.dow,.days{display:grid; grid-template-columns:repeat(7,1fr); gap:1px;}
.dow span{font-family:'IBM Plex Mono',monospace; font-size:9px; color:#9AA39A; text-align:center; padding-bottom:3px;}
.day{position:relative; aspect-ratio:1; border:none; background:none; padding:0; cursor:pointer; border-radius:2px; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.day-blank{cursor:default;}
.day-n{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink); line-height:1;}
.day-today{background:var(--ink);}
.day-today .day-n{color:#fff;}
.day-picked{outline:1.5px solid var(--ink);}
.marks{display:flex; gap:1.5px; align-items:center; height:5px; margin-top:2px;}
.dot{width:4.5px; height:4.5px; border-radius:50%; display:inline-block; flex:none;}
.bar{width:7px; height:2px; background:var(--alert); border-radius:1px; display:inline-block; flex:none;}
.line{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #EBEEE9; font-size:13.5px;}
.line .td-num{margin-left:auto;}

.foot{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:22px; padding-top:12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-2);}
.saving{opacity:.55;}
@media(prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>
<div id="app"><div class="empty">Starting up…</div></div>

<script>
"use strict";

/* ===================== date helpers ===================== */
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); };
const addDays = (d,n) => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((b-a)/86400000);
const today = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const monthLen = (y,m) => new Date(y,m+1,0).getDate();
const sundayOf = d => addDays(d, -d.getDay());
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["S","M","T","W","T","F","S"];
const fmtDate = d => MON[d.getMonth()]+" "+d.getDate();
const fmtLong = d => MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
const money = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(isFinite(n)?n:0);
const r2 = n => Math.round(n*100)/100;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===================== schedule math ===================== */
function streamPaydays(stream,start,end){
  const out=[];
  if(stream.type==="biweekly"){
    if(!stream.anchor) return out;
    let d=parse(stream.anchor);
    d=addDays(d, Math.floor(dayDiff(d,start)/14)*14);
    while(d<start) d=addDays(d,14);
    let g=0; while(d<end && g++<500){ out.push(d); d=addDays(d,14); }
  } else {
    const days=(stream.days&&stream.days.length?stream.days:[1,15]).slice().sort((a,b)=>a-b);
    let cur=new Date(start.getFullYear(),start.getMonth(),1); let g=0;
    while(cur<end && g++<400){
      const len=monthLen(cur.getFullYear(),cur.getMonth());
      for(const dd of days){
        const d=new Date(cur.getFullYear(),cur.getMonth(),Math.min(dd,len));
        if(d>=start && d<end) out.push(d);
      }
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
  }
  return out.sort((a,b)=>a-b);
}
function allPaydays(streams,start,end){
  const rows=[];
  streams.forEach(s=>streamPaydays(s,start,end).forEach(d=>rows.push({date:d,stream:s})));
  return rows.sort((a,b)=>a.date-b.date);
}
function nextDepositAfter(streams,d){
  const rows=allPaydays(streams, addDays(d,1), addDays(d,120));
  return rows.length?rows[0]:null;
}
function billsDue(bills,start,end){
  const out=[]; let cur=new Date(start.getFullYear(),start.getMonth(),1); let g=0;
  while(cur<end && g++<400){
    const len=monthLen(cur.getFullYear(),cur.getMonth());
    bills.forEach(b=>{
      const d=new Date(cur.getFullYear(),cur.getMonth(),Math.min(b.dueDay,len));
      if(d>=start && d<end) out.push({date:d,bill:b});
    });
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out.sort((a,b)=>a.date-b.date);
}
function periodOf(a,date,anchorISO){
  const anchor=parse(anchorISO); const p=Math.max(1,Number(a.periodDays)||7);
  const idx=Math.floor(dayDiff(anchor,date)/p);
  const start=addDays(anchor, idx*p);
  return {idx,start,end:addDays(start,p)};
}
function buildCycle(config,payDate,amount,adjust){
  const next=nextDepositAfter(config.streams,payDate);
  const end=next?next.date:addDays(payDate,14);
  const days=Math.max(1,dayDiff(payDate,end));
  const due=billsDue(config.bills,payDate,end);
  const billTotal=r2(due.reduce((s,x)=>s+Number(x.bill.amount||0),0));
  const reserves=config.allowances.map(a=>({allowance:a,value:r2((days/(Number(a.periodDays)||7))*Number(a.amount||0))}));
  const reserveTotal=r2(reserves.reduce((s,x)=>s+x.value,0));
  const cushion=Number(config.cushion||0);
  const transfer=r2(Number(amount||0)+Number(adjust||0)-billTotal-reserveTotal-cushion);
  return {start:payDate,end,days,due,billTotal,reserves,reserveTotal,cushion,transfer,nextStream:next?next.stream:null};
}

/* ===================== presets ===================== */
const PRESET_BILLS=[
  ["Rent",1,1972,false],["Netflix",1,20,false],["Swimming",1,0,true],["Retirement",2,0,true],
  ["Hulu",4,2.15,false],["Fidelity 529 College",5,100,false],["Apple TV",8,13,false],
  ["Renter Insurance (SF)",8,10,false],["Water/Trash/Sewer (CoC)",8,90,false],["Youtube Music",13,30,false],
  ["Student Loan",15,365,false],["Disney+",16,10,false],["Paramount",17,9,false],["Internet (Cox)",17,70,false],
  ["Electric (SRP)",18,220,true],["Life Insurance",19,127,false],["Gymnastics",20,245,false],
  ["HBO",24,3,false],["Phone (Google Fi)",25,100,false],["Peacock",27,2,false],["Google One (Photos)",30,10,false]
];
const PRESET_ALLOWANCES=[["Weekly extra",250,7],["Food",600,14],["Costco / House",300,14],["Gas",120,14]];
const COLORS=["#2E7D6F","#4A6FA5","#9A6B3F","#6B5B95","#3F7D8C"];

/* ===================== state ===================== */
const S={
  password: localStorage.getItem("ledgerPw") || null,
  rev: 0,
  config: null,
  ledger: null,
  tab: "now",
  note: null,
  noteBad: false,
  busy: false,
  picked: null,
  year: today().getFullYear(),
  payDate: iso(today()),
  payAmount: "",
  payAdjust: "",
  streamId: null
};
const blankConfig = () => ({
  streams:[], bills:[], allowances:[], cushion:0,
  periodAnchor: iso(sundayOf(today())), trackingStart: iso(sundayOf(today()))
});

/* ===================== api ===================== */
async function api(route, payload){
  const res = await fetch("/api/"+route, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({password:S.password}, payload||{}))
  });
  const data = await res.json().catch(()=>({error:"Server sent something unreadable."}));
  return {ok:res.ok, status:res.status, data};
}

async function load(quiet){
  const r = await api("load");
  if(!r.ok){
    if(r.status===401){ S.password=null; localStorage.removeItem("ledgerPw"); render(); return; }
    S.note = r.data.error || "Couldn't reach the ledger."; S.noteBad = true; render(); return;
  }
  S.rev = r.data.rev || 0;
  S.config = Object.assign(blankConfig(), r.data.config||{});
  if(!S.config.periodAnchor) S.config.periodAnchor = iso(sundayOf(today()));
  if(!S.config.trackingStart) S.config.trackingStart = iso(sundayOf(today()));
  S.ledger = Object.assign({paychecks:[],draws:[]}, r.data.ledger||{});
  if(!quiet) render();
}

let saveTimer=null;
async function save(){
  S.busy = true; paintBusy();
  const r = await api("save", {rev:S.rev, config:S.config, ledger:S.ledger});
  S.busy = false;
  if(r.status===409){
    S.rev = r.data.rev; S.config = r.data.config; S.ledger = r.data.ledger;
    S.note = r.data.message; S.noteBad = true; render(); return;
  }
  if(!r.ok){ S.note = r.data.error || "That didn't save. Check your connection."; S.noteBad = true; render(); return; }
  S.rev = r.data.rev;
  paintBusy();
}
function commit(){ render(); clearTimeout(saveTimer); saveTimer=setTimeout(save, 250); }
function paintBusy(){
  const el=document.getElementById("saveState");
  if(el) el.textContent = S.busy ? "Saving…" : "Saved";
}

/* ===================== derived ===================== */
function allowanceNow(){
  const t=today();
  return S.config.allowances.map(a=>{
    const p=periodOf(a,t,S.config.periodAnchor);
    const draws=S.ledger.draws.filter(d=>{const dt=parse(d.date); return d.allowanceId===a.id && dt>=p.start && dt<p.end;});
    const spent=r2(draws.reduce((s,d)=>s+Number(d.amount||0),0));
    return {allowance:a,period:p,draws,spent,remaining:r2(Number(a.amount)-spent)};
  });
}
function sweeps(){
  const t=today(); const out=[];
  S.config.allowances.forEach(a=>{
    if(a.sweep===false) return;
    const from=periodOf(a,parse(S.config.trackingStart),S.config.periodAnchor);
    const nowP=periodOf(a,t,S.config.periodAnchor);
    let cur=from.start; let g=0;
    while(cur<nowP.start && g++<400){
      const pe=addDays(cur,Number(a.periodDays));
      const spent=S.ledger.draws.filter(d=>{const dt=parse(d.date); return d.allowanceId===a.id && dt>=cur && dt<pe;})
        .reduce((s,d)=>s+Number(d.amount||0),0);
      out.push({name:a.name,start:cur,spent:r2(spent),amount:r2(Math.max(0,Number(a.amount)-spent))});
      cur=pe;
    }
  });
  return out.sort((a,b)=>b.start-a.start);
}
function savingsTotal(){
  return r2(S.ledger.paychecks.reduce((s,p)=>s+Number(p.transfer||0),0) + sweeps().reduce((s,w)=>s+w.amount,0));
}

/* ===================== render ===================== */
const app = document.getElementById("app");

function render(){
  if(!S.password){ renderGate(); return; }
  if(!S.config){ app.innerHTML='<div class="empty">Loading the ledger…</div>'; return; }

  const configured = S.config.streams.length>0 || S.config.bills.length>0;
  const tabs=[["now","Log a paycheck"],["budgets","Budgets"],["year","Year"],["setup","Bills & pay"]];

  app.innerHTML =
    '<header class="masthead"><div>'+
      '<div class="eyebrow">Household ledger</div><h1>What can go to savings</h1></div>'+
      '<div class="savings-chip"><span>Saved to date</span><strong>'+money(savingsTotal())+'</strong></div>'+
    '</header>'+
    '<nav class="tabs" role="tablist">'+tabs.map(t=>
      '<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>').join("")+
    '</nav>'+
    (S.note?'<div class="note'+(S.noteBad?' note-bad':'')+'" role="status"><span>'+esc(S.note)+'</span><button class="link" data-act="clearnote">Dismiss</button></div>':'')+
    '<main id="main">'+
      (!configured && S.tab!=="setup"
        ? '<div class="empty"><p>Nothing set up yet. Add your paychecks and bills first.</p><button class="btn" data-act="tab" data-v="setup">Go to Bills &amp; pay</button></div>'
        : (S.tab==="now"?viewNow():S.tab==="budgets"?viewBudgets():S.tab==="year"?viewYear():viewSetup()))+
    '</main>'+
    '<footer class="foot"><span>Shared ledger — both of you see the same numbers. <span id="saveState">Saved</span></span>'+
    '<span><button class="link" data-act="reload">Reload</button><button class="link" data-act="logout">Sign out</button></span></footer>';
}

function renderGate(){
  app.innerHTML =
    '<div class="gate"><div class="eyebrow">Household ledger</div>'+
    '<h1>Enter the password</h1>'+
    '<p class="muted">Both of you use the same password. It stays saved on this device.</p>'+
    '<input type="password" id="pw" autocomplete="current-password" placeholder="Password">'+
    (S.note?'<p class="warn">'+esc(S.note)+'</p>':'')+
    '<button class="btn btn-lg" data-act="signin">Open ledger</button></div>';
  const el=document.getElementById("pw");
  el.focus();
  el.addEventListener("keydown", e=>{ if(e.key==="Enter") signIn(); });
}

async function signIn(){
  const v=document.getElementById("pw").value;
  if(!v) return;
  S.password=v;
  const r=await api("load");
  if(!r.ok){
    S.password=null;
    S.note = r.status===401 ? "That password doesn't match." : (r.data.error||"Couldn't reach the ledger.");
    renderGate(); return;
  }
  localStorage.setItem("ledgerPw", v);
  S.note=null;
  S.rev=r.data.rev||0;
  S.config=Object.assign(blankConfig(), r.data.config||{});
  if(!S.config.periodAnchor) S.config.periodAnchor=iso(sundayOf(today()));
  if(!S.config.trackingStart) S.config.trackingStart=iso(sundayOf(today()));
  S.ledger=Object.assign({paychecks:[],draws:[]}, r.data.ledger||{});
  render();
}

/* ---------- view: log a paycheck ---------- */
function currentCycle(){
  return buildCycle(S.config, parse(S.payDate), Number(S.payAmount||0), Number(S.payAdjust||0));
}
function runwayHTML(c){
  const seg=[["Bills",c.billTotal,"#8C5B57"],["Allowances",c.reserveTotal,"#9A6B3F"],
             ["Cushion",c.cushion,"#7A8B86"],["To savings",Math.max(0,c.transfer),"#2E7D6F"]].filter(x=>x[1]>0);
  const total=seg.reduce((s,x)=>s+x[1],0);
  if(!total) return "";
  return '<div class="runway"><div class="runway-track">'+
    seg.map(x=>'<div class="runway-seg" style="width:'+((x[1]/total)*100)+'%;background:'+x[2]+'"></div>').join("")+
    '</div><div class="runway-key">'+
    seg.map(x=>'<span class="key-item"><i style="background:'+x[2]+'"></i>'+x[0]+' <b>'+money(x[1])+'</b></span>').join("")+
    '</div></div>';
}
function verdictHTML(){
  const c=currentCycle();
  const short=c.transfer<0;
  const has=S.payAmount!=="" && Number(S.payAmount)>0;
  return '<div class="verdict-label">'+(short?"Short this cycle":"Safe to transfer")+'</div>'+
    '<div class="verdict-num'+(short?' short':'')+'">'+money(Math.abs(c.transfer))+'</div>'+
    '<p class="verdict-sub">Covers '+fmtLong(c.start)+' through '+fmtLong(addDays(c.end,-1))+' — '+c.days+' days'+
      (c.nextStream?', until '+esc(c.nextStream.name)+' lands.':'.')+'</p>'+
    (has?runwayHTML(c):'')+
    (short&&has?'<p class="warn">This deposit doesn\'t cover the window. You\'re '+money(Math.abs(c.transfer))+
      ' short — pull from savings, or trim an allowance for these '+c.days+' days.</p>':'')+
    '<button class="btn btn-lg" data-act="recordPay"'+(has?'':' disabled')+'>Record this paycheck</button>';
}
function coversHTML(){
  const c=currentCycle();
  let rows = c.due.map(x=>'<tr><td class="td-date">'+fmtDate(x.date)+'</td><td>'+esc(x.bill.name)+
      (x.bill.variable?'<span class="tag">estimate</span>':'')+'</td><td class="td-num">'+money(Number(x.bill.amount))+'</td></tr>').join("");
  if(!c.due.length) rows='<tr><td colspan="3" class="muted">No dated bills fall in this window — a light cycle.</td></tr>';
  rows+='<tr class="tr-total"><td></td><td>Bills</td><td class="td-num">'+money(c.billTotal)+'</td></tr>';
  rows+=c.reserves.map(x=>'<tr><td></td><td class="muted small">'+esc(x.allowance.name)+' — '+c.days+' days at '+
      money(x.allowance.amount)+'/'+x.allowance.periodDays+'d</td><td class="td-num">'+money(x.value)+'</td></tr>').join("");
  rows+='<tr class="tr-total"><td></td><td>Allowances</td><td class="td-num">'+money(c.reserveTotal)+'</td></tr>';
  if(c.cushion>0) rows+='<tr class="tr-total"><td></td><td>Cushion left in checking</td><td class="td-num">'+money(c.cushion)+'</td></tr>';
  return '<table><tbody>'+rows+'</tbody></table><p class="muted small">'+
    allowanceNow().map(a=>esc(a.allowance.name)+": "+money(a.remaining)+" left").join(" · ")+'</p>';
}
function viewNow(){
  if(!S.streamId && S.config.streams.length) S.streamId=S.config.streams[0].id;
  const stream=S.config.streams.find(s=>s.id===S.streamId);
  return '<div class="grid">'+
    '<section class="panel"><h2 class="panel-title">This deposit</h2>'+
      '<div class="row">'+
        '<label class="field"><span class="field-label">Which paycheck</span><select data-act="setStream">'+
          (S.config.streams.length?'':'<option value="">Add a paycheck in setup</option>')+
          S.config.streams.map(s=>'<option value="'+s.id+'"'+(s.id===S.streamId?' selected':'')+'>'+esc(s.name)+'</option>').join("")+
        '</select></label>'+
        '<label class="field"><span class="field-label">Date received</span>'+
          '<input type="date" data-act="setPayDate" value="'+S.payDate+'"></label>'+
      '</div><div class="row">'+
        '<label class="field"><span class="field-label">Exact amount</span>'+
          '<input type="number" step="0.01" inputmode="decimal" placeholder="0.00" id="payAmt" value="'+S.payAmount+'"></label>'+
        '<label class="field"><span class="field-label">Adjustment</span>'+
          '<input type="number" step="0.01" inputmode="decimal" placeholder="0.00" id="payAdj" value="'+S.payAdjust+'">'+
          '<span class="field-hint">Money already in checking, or a one-off cost. Minus sign to subtract.</span></label>'+
      '</div>'+
      (stream&&stream.expected?'<button class="link" data-act="useTypical">Use typical amount ('+money(stream.expected)+')</button>':'')+
    '</section>'+
    '<section class="panel verdict" id="verdict">'+verdictHTML()+'</section>'+
    '<section class="panel"><h2 class="panel-title">What it has to cover</h2><div id="covers">'+coversHTML()+'</div></section>'+
    '<section class="panel"><h2 class="panel-title">Recorded paychecks</h2>'+
      (S.ledger.paychecks.length?'<table><tbody>'+S.ledger.paychecks.slice(0,12).map(p=>
        '<tr><td class="td-date">'+fmtDate(parse(p.date))+'</td><td>'+esc(p.streamName)+
        '<br><span class="muted small">'+money(p.amount)+' in</span></td>'+
        '<td class="td-num td-good">'+money(p.transfer)+'</td>'+
        '<td class="td-x"><button class="link" data-act="delPay" data-v="'+p.id+'">Remove</button></td></tr>').join("")+
        '</tbody></table>':'<p class="muted">Nothing recorded yet. Log a deposit above and it lands here.</p>')+
    '</section></div>';
}

/* ---------- view: budgets ---------- */
function viewBudgets(){
  const now=allowanceNow(); const sw=sweeps();
  const cards = now.length? now.map(a=>{
    const pct=Math.max(0,Math.min(100,(a.remaining/(Number(a.allowance.amount)||1))*100));
    const over=a.remaining<0;
    return '<div class="panel card"><div class="verdict-label">'+esc(a.allowance.name)+'</div>'+
      '<div class="card-num'+(over?' short':'')+'">'+money(a.remaining)+'</div>'+
      '<div class="runway-track"><div class="runway-seg" style="width:'+pct+'%;background:'+(over?"#8C5B57":"#2E7D6F")+'"></div>'+
      '<div class="runway-seg" style="width:'+(100-pct)+'%;background:#D6D9D4"></div></div>'+
      '<p class="muted small">'+money(a.spent)+' of '+money(a.allowance.amount)+' used · resets '+fmtDate(a.period.end)+'</p></div>';
  }).join("") : '<div class="empty">No budgets set up yet.</div>';

  const nameOf=id=>{const a=S.config.allowances.find(x=>x.id===id); return a?a.name:"—";};

  return '<div class="cards">'+cards+'</div><div class="grid">'+
    '<section class="panel"><h2 class="panel-title">Log spending</h2><div class="row">'+
      '<label class="field"><span class="field-label">From which budget</span><select id="drawAllow">'+
        S.config.allowances.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join("")+'</select></label>'+
      '<label class="field"><span class="field-label">Amount</span>'+
        '<input type="number" step="0.01" inputmode="decimal" placeholder="0.00" id="drawAmt"></label>'+
    '</div><div class="row">'+
      '<label class="field"><span class="field-label">What for</span><input type="text" id="drawWhat" placeholder="Costco run, gas, takeout…"></label>'+
      '<label class="field"><span class="field-label">Date</span><input type="date" id="drawDate" value="'+iso(today())+'"></label>'+
    '</div><button class="btn" data-act="addDraw">Add spending</button></section>'+
    '<section class="panel"><h2 class="panel-title">Recent spending</h2>'+
      (S.ledger.draws.length?'<table><tbody>'+S.ledger.draws.slice(0,15).map(d=>
        '<tr><td class="td-date">'+fmtDate(parse(d.date))+'</td><td>'+esc(d.what)+
        '<br><span class="muted small">'+esc(nameOf(d.allowanceId))+'</span></td>'+
        '<td class="td-num">'+money(d.amount)+'</td>'+
        '<td class="td-x"><button class="link" data-act="delDraw" data-v="'+d.id+'">Remove</button></td></tr>').join("")+
        '</tbody></table>':'<p class="muted">Nothing logged yet. Every budget is full.</p>')+
    '</section>'+
    '<section class="panel"><h2 class="panel-title">Swept to savings</h2>'+
      (sw.length?'<table><tbody>'+sw.slice(0,14).map(w=>
        '<tr><td class="td-date">'+fmtDate(w.start)+'</td><td>'+esc(w.name)+
        '<br><span class="muted small">'+money(w.spent)+' spent</span></td>'+
        '<td class="td-num td-good">'+money(w.amount)+'</td></tr>').join("")+
        '</tbody></table>':'<p class="muted">No closed periods yet. The first sweep posts when a budget period ends.</p>')+
    '</section></div>';
}

/* ---------- view: year ---------- */
function viewYear(){
  const y=S.year, start=new Date(y,0,1), end=new Date(y+1,0,1);
  const pays=allPaydays(S.config.streams,start,end), bills=billsDue(S.config.bills,start,end);
  const payMap={}, billMap={};
  pays.forEach(p=>{(payMap[iso(p.date)]=payMap[iso(p.date)]||[]).push(p);});
  bills.forEach(b=>{(billMap[iso(b.date)]=billMap[iso(b.date)]||[]).push(b);});
  const colorFor=id=>COLORS[Math.max(0,S.config.streams.findIndex(s=>s.id===id))%COLORS.length];
  const t=iso(today());

  let html='<section class="panel"><div class="year-head">'+
    '<button class="link" data-act="year" data-v="'+(y-1)+'">← '+(y-1)+'</button>'+
    '<h2 class="year-title">'+y+'</h2>'+
    '<button class="link" data-act="year" data-v="'+(y+1)+'">'+(y+1)+' →</button></div>'+
    '<div class="legend">'+S.config.streams.map(s=>'<span class="key-item"><i style="background:'+colorFor(s.id)+'"></i>'+esc(s.name)+'</span>').join("")+
    '<span class="key-item"><i class="bill-key"></i>Bill due</span></div></section><div class="months">';

  for(let mi=0;mi<12;mi++){
    const len=monthLen(y,mi), lead=new Date(y,mi,1).getDay();
    html+='<div class="month"><h3>'+MONTHS[mi]+'</h3><div class="dow">'+DOW.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="days">';
    for(let i=0;i<lead;i++) html+='<span class="day day-blank"></span>';
    for(let d=1;d<=len;d++){
      const k=iso(new Date(y,mi,d)); const p=payMap[k], b=billMap[k];
      html+='<button class="day'+(k===t?' day-today':'')+(S.picked===k?' day-picked':'')+'" data-act="pick" data-v="'+k+'">'+
        '<span class="day-n">'+d+'</span><span class="marks">'+
        (p?p.map(x=>'<i class="dot" style="background:'+colorFor(x.stream.id)+'"></i>').join(""):'')+
        (b?'<i class="bar"></i>':'')+'</span></button>';
    }
    html+='</div></div>';
  }
  html+='</div>';

  if(S.picked){
    const p=payMap[S.picked]||[], b=billMap[S.picked]||[];
    html+='<section class="panel"><h2 class="panel-title">'+fmtLong(parse(S.picked))+'</h2>'+
      p.map(x=>'<div class="line"><i class="dot" style="background:'+colorFor(x.stream.id)+'"></i><span>'+esc(x.stream.name)+
        ' lands</span><span class="td-num">'+(x.stream.expected?"~"+money(x.stream.expected):"")+'</span></div>').join("")+
      b.map(x=>'<div class="line"><i class="bar"></i><span>'+esc(x.bill.name)+'</span><span class="td-num">'+money(Number(x.bill.amount))+'</span></div>').join("")+
      (!p.length&&!b.length?'<p class="muted">Nothing scheduled.</p>':'')+'</section>';
  }
  return html;
}

/* ---------- view: setup ---------- */

  const monthlyAllow=r2(S.config.allowances.reduce((s,a)=>s+(Number(a.amount)*365)/(Number(a.periodDays)*12),0));
  const isBi = (document.getElementById("newStreamType")||{}).value !== "semimonthly";

  return '<div class="grid">'+
  '<section class="panel"><h2 class="panel-title">Paychecks</h2>'+
    (S.config.streams.length?'<table><tbody>'+S.config.streams.map((s,i)=>
      '<tr><td><i class="dot" style="background:'+COLORS[i%COLORS.length]+'"></i></td><td>'+esc(s.name)+
      '<br><span class="muted small">'+(s.type==="biweekly"?'Every 2 weeks from '+fmtLong(parse(s.anchor)):'On the '+s.days.join(" and ")+' of each month')+'</span></td>'+

      '<label class="field"><span class="field-label">Name it</span><input type="text" id="nsName" placeholder="Brooke — ASU Prep"></label>'+
      '<label class="field"><span class="field-label">Schedule</span><select id="newStreamType" data-act="reRender">'+
        '<option value="biweekly"'+(isBi?' selected':'')+'>Every two weeks (26/yr)</option>'+

        ? '<label class="field"><span class="field-label">A recent payday</span><input type="date" id="nsAnchor" value="'+iso(today())+'">'+

        '<span class="field-hint">A shortcut only. You enter the exact amount each payday.</span></label>'+
    '</div><button class="btn" data-act="addStream">Add paycheck</button></div></section>'+

  '<section class="panel"><h2 class="panel-title">Resetting budgets <span class="muted small">≈'+money(monthlyAllow)+'/mo</span></h2>'+

  '</section></div>';

/* ===================== events ===================== */
const val=id=>{const e=document.getElementById(id); return e?e.value:"";};
const chk=id=>{const e=document.getElementById(id); return e?e.checked:false;};

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;

  if(act==="signin"){ signIn(); return; }
  if(act==="tab"){ S.tab=v; render(); return; }
  if(act==="clearnote"){ S.note=null; render(); return; }
  if(act==="reload"){ load(); return; }
  if(act==="logout"){ localStorage.removeItem("ledgerPw"); S.password=null; S.config=null; S.note=null; render(); return; }
  if(act==="year"){ S.year=Number(v); S.picked=null; render(); return; }
  if(act==="pick"){ S.picked = S.picked===v?null:v; render(); return; }
  if(act==="useTypical"){
    const s=S.config.streams.find(x=>x.id===S.streamId);
    if(s){ S.payAmount=String(s.expected); render(); }
    return;
  }

  if(act==="preset"){
    S.config.bills=PRESET_BILLS.map((b,i)=>({id:"b"+Date.now()+i,name:b[0],dueDay:b[1],amount:b[2],variable:b[3]}));
    S.config.allowances=PRESET_ALLOWANCES.map((a,i)=>({id:"a"+Date.now()+i,name:a[0],amount:a[1],periodDays:a[2],sweep:true}));
    commit(); return;
  }
  if(act==="addStream"){
    const type=val("newStreamType")||"biweekly";
    const s={id:"s"+Date.now(), name:(val("nsName")||"Paycheck").trim(), type, expected:Number(val("nsAmt")||0)};
    if(type==="biweekly") s.anchor=val("nsAnchor")||iso(today());
    else s.days=String(val("nsDays")||"1,15").split(",").map(x=>Math.max(1,Math.min(31,parseInt(x.trim(),10)||1)));
    S.config.streams.push(s); commit(); return;
  }
  if(act==="addBill"){
    S.config.bills.push({id:"b"+Date.now(), name:(val("nbName")||"Bill").trim(), amount:Number(val("nbAmt")||0),
      dueDay:Math.max(1,Math.min(31,Number(val("nbDay"))||1)), variable:chk("nbVar")});
    S.config.bills.sort((a,b)=>a.dueDay-b.dueDay); commit(); return;
  }
  if(act==="addAllow"){
    S.config.allowances.push({id:"a"+Date.now(), name:(val("naName")||"Budget").trim(), amount:Number(val("naAmt")||0),
      periodDays:Math.max(1,Number(val("naDays"))||14), sweep:true});
    commit(); return;
  }
  if(act==="delStream"){ S.config.streams=S.config.streams.filter(x=>x.id!==v); if(S.streamId===v) S.streamId=null; commit(); return; }
  if(act==="delBill"){ S.config.bills=S.config.bills.filter(x=>x.id!==v); commit(); return; }
  if(act==="delAllow"){ S.config.allowances=S.config.allowances.filter(x=>x.id!==v); commit(); return; }
  if(act==="delPay"){ S.ledger.paychecks=S.ledger.paychecks.filter(x=>x.id!==v); commit(); return; }
  if(act==="delDraw"){ S.ledger.draws=S.ledger.draws.filter(x=>x.id!==v); commit(); return; }

  if(act==="recordPay"){
    const c=currentCycle();
    const s=S.config.streams.find(x=>x.id===S.streamId);
    S.ledger.paychecks.unshift({id:"p"+Date.now(), streamId:S.streamId, streamName:s?s.name:"Paycheck",
      date:S.payDate, amount:Number(S.payAmount||0), adjust:Number(S.payAdjust||0),
      transfer:Math.max(0,c.transfer), coversThrough:iso(c.end)});
    S.ledger.paychecks=S.ledger.paychecks.slice(0,200);
    S.payAmount=""; S.payAdjust=""; commit(); return;
  }
  if(act==="addDraw"){
    const amt=Number(val("drawAmt")||0);
    if(!(amt>0)) return;
    S.ledger.draws.unshift({id:"d"+Date.now(), allowanceId:val("drawAllow"), date:val("drawDate")||iso(today()),
      amount:amt, what:(val("drawWhat")||"Spending").trim()});
    S.ledger.draws=S.ledger.draws.slice(0,800); commit(); return;
  }
});

/* live verdict update without losing focus */
document.addEventListener("input", e=>{
  if(e.target.id==="payAmt" || e.target.id==="payAdj"){
    if(e.target.id==="payAmt") S.payAmount=e.target.value; else S.payAdjust=e.target.value;
    const v=document.getElementById("verdict"), c=document.getElementById("covers");
    if(v) v.innerHTML=verdictHTML();
    if(c) c.innerHTML=coversHTML();
  }
});

/* committed edits fire on blur/change so typing isn't interrupted */
document.addEventListener("change", e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act, v=el.dataset.v, f=el.dataset.f;

  if(act==="setStream"){ S.streamId=el.value; render(); return; }
  if(act==="setPayDate"){ S.payDate=el.value; render(); return; }
  if(act==="reRender"){ render(); return; }
  if(act==="editRule"){
    S.config[f] = (f==="cushion") ? Number(el.value||0) : el.value;
    commit(); return;
  }
  if(act==="editBill"){
    const b=S.config.bills.find(x=>x.id===v); if(!b) return;
    b[f] = f==="variable" ? el.checked : (f==="name" ? el.value : Number(el.value||0));
    if(f==="dueDay") S.config.bills.sort((x,y)=>x.dueDay-y.dueDay);
    commit(); return;
  }
  if(act==="editAllow"){
    const a=S.config.allowances.find(x=>x.id===v); if(!a) return;
    a[f] = f==="name" ? el.value : Number(el.value||0);
    commit(); return;
  }
});

/* ===================== boot ===================== */
(async function(){
  if(S.password){ await load(); } else { render(); }
  setInterval(async ()=>{
    if(!S.password || S.busy || document.hidden) return;
    const before=S.rev;
    await load(true);
    if(S.rev!==before) render();
  }, 15000);
})();
</script>
</body>
</html>
