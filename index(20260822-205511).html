<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Household Ledger</title>

<style>
:root{
  --ink:#16233A; --ink-2:#4A5568; --paper:#EDF0EC; --card:#FFFFFF;
  --line:#D6DBD4; --good:#2E7D6F; --brass:#9A6B3F; --alert:#8C5B57;
  --soft:#F7F8F5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{color:var(--ink);font-family:'Archivo',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit}
button{touch-action:manipulation}
#app{max-width:1120px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}

.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1.5px solid var(--ink)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.masthead h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;margin:4px 0 0}
.sync{text-align:right}
.sync span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.sync strong{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--good)}

.tabs{display:flex;gap:2px;margin:16px 0;flex-wrap:wrap}
.tab{font-size:13px;padding:9px 14px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;border-radius:2px}
.tab[aria-selected="true"]{background:var(--ink);color:white;border-color:var(--ink)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}

@media(max-width:520px){.cards{grid-template-columns:1fr}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px}
.panel-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hero{border-top:3px solid var(--good)}

.hero-note.good{border-left-color:var(--good)}
.hero-note.warn{border-left-color:var(--brass)}
.hero-note.bad{border-left-color:var(--alert)}

.metric{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--good);padding:14px}
.metric-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

.metric.good .metric-num{color:var(--good)}
.metric.bad{border-top-color:var(--alert)}
.metric.bad .metric-num{color:var(--alert)}

.progress{height:9px;background:#D8DDD7;border-radius:2px;overflow:hidden;margin:10px 0 7px}
.progress > i{display:block;height:100%;background:var(--good)}
.progress > i.over{background:var(--alert)}

.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1 1 150px}
.field{display:block;margin-bottom:12px}
.field-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.field-hint{display:block;font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}
input,select{width:100%;font-family:'IBM Plex Mono',monospace;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:2px;background:#FBFCFA;color:var(--ink)}
input[type=text]{font-family:'Archivo',sans-serif}
input[type=checkbox]{width:auto}

.btn{font-size:14px;font-weight:500;padding:11px 18px;background:var(--ink);color:#fff;border:none;border-radius:2px;cursor:pointer;margin-top:4px}
.btn[disabled]{background:#B7BDB6;cursor:not-allowed}
.btn-light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--alert)}
.link{background:none;border:none;color:var(--ink-2);font-size:12px;text-decoration:underline;cursor:pointer;padding:3px 6px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 4px;border-bottom:1px solid #EBEEE9;vertical-align:top}
.td-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-2);white-space:nowrap;width:1%}
.td-num{font-family:'IBM Plex Mono',monospace;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.td-good{color:var(--good);font-weight:600}
.td-bad{color:var(--alert);font-weight:600}
.td-x{text-align:right;width:1%}
.tr-total td{border-bottom:none;border-top:1px solid var(--line);font-weight:600;padding-top:10px}
.inline-in{border:none!important;background:transparent!important;padding:3px!important;font-size:14px!important}
.inline-num{text-align:right;max-width:105px}
.inline-day{max-width:52px;text-align:right}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin:6px 0}

.note{background:#FFF6E6;border:1px solid #E3CFA3;padding:10px 12px;border-radius:2px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.note-bad{background:#F7EFEE;border-color:#D9BAB6}
.muted{color:var(--ink-2);font-size:13px}
.small{font-size:11.5px}
.empty{background:var(--card);border:1px dashed var(--line);padding:36px 20px;text-align:center;color:var(--ink-2);border-radius:3px}
.adder{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:2px;padding:1px 4px;color:var(--ink-2)}
.badge.good{color:var(--good);border-color:var(--good)}
.badge.brass{color:var(--brass);border-color:var(--brass)}

.cycle-strip{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:#fff;border:1px solid var(--line)}
.cycle-strip strong{font-family:'Newsreader',Georgia,serif;font-size:21px;font-weight:600}
.cycle-strip span{font-size:12px;color:var(--ink-2)}

.year-head{display:flex;justify-content:space-between;align-items:center}
.year-title{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:26px;margin:0}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media(max-width:900px){.months{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.months{grid-template-columns:1fr}}
.month{background:#fff;border:1px solid var(--line);border-radius:3px;padding:12px}
.month h3{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:15px;margin:0 0 8px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.dow span{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#9AA39A;text-align:center;padding-bottom:3px}
.day{position:relative;aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.day-blank{cursor:default}
.day-n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink);line-height:1}
.day-today{background:var(--ink)}
.day-today .day-n{color:#fff}
.day-picked{outline:1.5px solid var(--ink)}
.day-cycle::before{content:"";position:absolute;top:1px;left:3px;right:3px;height:2px;background:var(--good);border-radius:1px}
.marks{display:flex;gap:1.5px;align-items:center;height:5px;margin-top:2px}
.dot{width:4.5px;height:4.5px;border-radius:50%;display:inline-block;flex:none}
.bar{width:7px;height:2px;background:var(--alert);border-radius:1px;display:inline-block;flex:none}
.line{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #EBEEE9;font-size:13.5px}
.line .td-num{margin-left:auto}

.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading shared ledger…</div></div>

<script>
"use strict";

/* ===================== helpers ===================== */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((b-a)/86400000);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const monthLen=(y,m)=>new Date(y,m+1,0).getDate();
const sundayOf=d=>addDays(d,-d.getDay());
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["S","M","T","W","T","F","S"];
const fmtDate=d=>MON[d.getMonth()]+" "+d.getDate();
const fmtLong=d=>MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(isFinite(n)?n:0);
const r2=n=>Math.round(Number(n||0)*100)/100;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now()+Math.random().toString(36).slice(2,7);

/* ===================== defaults ===================== */
const DEFAULT_BILLS=[
 ["Rent",1,1972,false],["Netflix",1,20,false],["Swimming",1,0,true],["Retirement",2,0,true],
 ["Hulu",4,2.15,false],["Fidelity 529 College",5,100,false],["Apple TV",8,13,false],
 ["Renter Insurance (SF)",8,10,false],["Water/Trash/Sewer (CoC)",8,90,false],["Youtube Music",13,30,false],
 ["Student Loan",15,365,false],["Disney+",16,10,false],["Paramount",17,9,false],["Internet (Cox)",17,70,false],
 ["Electric (SRP)",18,220,true],["Life Insurance",19,127,false],["Gymnastics",20,245,false],
 ["HBO",24,3,false],["Phone (Google Fi)",25,100,false],["Peacock",27,2,false],["Google One (Photos)",30,10,false]
];
const DEFAULT_BUCKETS=[
 ["Gas",120],
 ["Costco / House",300],
 ["Budgeted Extras",500],
 ["Food",600]
];
const COLORS=["#2E7D6F","#4A6FA5","#9A6B3F","#6B5B95","#3F7D8C"];

/* ===================== schedule & cycle math ===================== */
function streamPaydays(stream,start,end){
  const out=[];
  if(stream.type==="biweekly"){
    if(!stream.anchor)return out;
    let d=parse(stream.anchor);
    d=addDays(d,Math.floor(dayDiff(d,start)/14)*14);
    while(d<start)d=addDays(d,14);
    let g=0;
    while(d<end&&g++<500){out.push(d);d=addDays(d,14)}
  }else{
    const days=(stream.days&&stream.days.length?stream.days:[1,15]).slice().sort((a,b)=>a-b);
    let cur=new Date(start.getFullYear(),start.getMonth(),1),g=0;
    while(cur<end&&g++<400){
      const len=monthLen(cur.getFullYear(),cur.getMonth());
      for(const dd of days){
        const d=new Date(cur.getFullYear(),cur.getMonth(),Math.min(dd,len));
        if(d>=start&&d<end)out.push(d);
      }
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
  }
  return out.sort((a,b)=>a-b);
}
function allPaydays(streams,start,end){
  const rows=[];
  streams.forEach(s=>streamPaydays(s,start,end).forEach(d=>rows.push({date:d,stream:s})));
  return rows.sort((a,b)=>a.date-b.date);
}
function billsDue(bills,start,end){
  const out=[];
  let cur=new Date(start.getFullYear(),start.getMonth(),1),g=0;
  while(cur<end&&g++<400){
    const len=monthLen(cur.getFullYear(),cur.getMonth());
    bills.forEach(b=>{
      const d=new Date(cur.getFullYear(),cur.getMonth(),Math.min(Number(b.dueDay)||1,len));
      if(d>=start&&d<end)out.push({date:d,bill:b});
    });
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out.sort((a,b)=>a.date-b.date);
}
function cycleFor(date){
  const anchor=parse(S.config.periodAnchor);
  const idx=Math.floor(dayDiff(anchor,date)/14);
  const start=addDays(anchor,idx*14);
  return {idx,start,end:addDays(start,14)};
}
function cycleStartsIn(start,end){
  const anchor=parse(S.config.periodAnchor);
  let idx=Math.floor(dayDiff(anchor,start)/14);
  let d=addDays(anchor,idx*14);
  while(d<start)d=addDays(d,14);
  const out=[];
  while(d<end){out.push(iso(d));d=addDays(d,14)}
  return new Set(out);
}
function inRange(dateISO,start,end){
  const d=parse(dateISO);
  return d>=start&&d<end;
}

/* ===================== state ===================== */
const S={
  rev:0,
  config:null,
  ledger:null,
  tab:"cycle",
  note:null,
  noteBad:false,
  busy:false,
  picked:null,
  year:today().getFullYear(),
  setupScheduleType:"biweekly"
};

function blankConfig(){
  return{
    streams:[],
    bills:[],
    allowances:[],
    cushion:0,
    periodAnchor:iso(sundayOf(today())),
    trackingStart:iso(sundayOf(today()))
  };
}
function normalize(){
  S.config=Object.assign(blankConfig(),S.config||{});
  if(!S.config.periodAnchor)S.config.periodAnchor=iso(sundayOf(today()));
  if(!Array.isArray(S.config.streams))S.config.streams=[];
  if(!Array.isArray(S.config.bills))S.config.bills=[];
  if(!Array.isArray(S.config.allowances))S.config.allowances=[];
  S.config.allowances=S.config.allowances.map(a=>({
    id:a.id||uid("a"),
    name:a.name||"Budget",
    amount:Number(a.amount||0),
    periodDays:14,
    sweep:false
  }));
  S.ledger=Object.assign({paychecks:[],draws:[]},S.ledger||{});
  if(!Array.isArray(S.ledger.paychecks))S.ledger.paychecks=[];
  if(!Array.isArray(S.ledger.draws))S.ledger.draws=[];
}

/* ===================== shared Cloudflare API ===================== */
async function api(route,payload){
  try{
    const res=await fetch("/api/"+route,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload||{})
    });
    const text=await res.text();
    let data;
    try{data=JSON.parse(text)}catch{data={error:"The shared storage returned an unreadable response."}}
    return{ok:res.ok,status:res.status,data};
  }catch{
    return{ok:false,status:0,data:{error:"Couldn't reach the shared ledger."}};
  }
}
async function load(quiet=false){
  const r=await api("load");
  if(!r.ok){
    S.note=r.data.error||"Couldn't reach the shared ledger.";
    S.noteBad=true;
    if(!quiet)render();
    return;
  }
  S.rev=Number(r.data.rev||0);
  S.config=r.data.config||blankConfig();
  S.ledger=r.data.ledger||{paychecks:[],draws:[]};
  normalize();
  if(!quiet)render();
}
let saveTimer=null;
async function save(){
  S.busy=true;paintBusy();
  const r=await api("save",{rev:S.rev,config:S.config,ledger:S.ledger});
  S.busy=false;
  if(r.status===409){
    S.rev=r.data.rev;
    S.config=r.data.config;
    S.ledger=r.data.ledger;
    normalize();
    S.note=r.data.message||"Someone else saved first. Your view was refreshed.";
    S.noteBad=true;
    render();
    return;
  }
  if(!r.ok){
    S.note=r.data.error||"That didn't save. Check your connection.";
    S.noteBad=true;
    render();
    return;
  }
  S.rev=Number(r.data.rev||S.rev+1);
  paintBusy();
}
function commit(){
  render();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(save,250);
}
function paintBusy(){
  const el=document.getElementById("saveState");
  if(el)el.textContent=S.busy?"Saving…":"Saved";
}

/* ===================== cycle derived data ===================== */
function currentCycleData(){
  const cycle=cycleFor(today());
  const pays=S.ledger.paychecks.filter(p=>inRange(p.date,cycle.start,cycle.end));
  const income=r2(pays.reduce((sum,p)=>sum+Number(p.amount||0),0));
  const due=billsDue(S.config.bills,cycle.start,cycle.end);
  const billTotal=r2(due.reduce((sum,x)=>sum+Number(x.bill.amount||0),0));
  const bucketTotal=r2(S.config.allowances.reduce((sum,a)=>sum+Number(a.amount||0),0));
  const cushion=Number(S.config.cushion||0);
  const available=r2(income-billTotal-bucketTotal-cushion);

  const expected=allPaydays(S.config.streams,cycle.start,cycle.end);
  const recordedByStream={};
  pays.forEach(p=>recordedByStream[p.streamId]=(recordedByStream[p.streamId]||0)+1);
  const expectedByStream={};
  expected.forEach(p=>expectedByStream[p.stream.id]=(expectedByStream[p.stream.id]||0)+1);
  let pending=0;
  Object.keys(expectedByStream).forEach(id=>{
    pending+=Math.max(0,expectedByStream[id]-(recordedByStream[id]||0));
  });

  return{cycle,pays,income,due,billTotal,bucketTotal,cushion,available,expected,pending};
}
function bucketStatus(){
  const c=cycleFor(today());
  return S.config.allowances.map(a=>{
    const draws=S.ledger.draws.filter(d=>d.allowanceId===a.id&&inRange(d.date,c.start,c.end));
    const spent=r2(draws.reduce((sum,d)=>sum+Number(d.amount||0),0));
    return{allowance:a,draws,spent,remaining:r2(Number(a.amount||0)-spent)};
  });
}

/* ===================== render shell ===================== */
const app=document.getElementById("app");
function render(){
  if(!S.config||!S.ledger){
    app.innerHTML='<div class="empty">Loading shared ledger…</div>';
    return;
  }
  const tabs=[["cycle","Current cycle"],["budgets","Spending buckets"],["year","Year"],["setup","Setup"]];
  app.innerHTML=
    '<header class="masthead"><div><div class="eyebrow">Household ledger</div><h1>Two-week budget</h1></div>'+
    '<div class="sync"><span>Shared ledger</span><strong id="saveState">'+(S.busy?"Saving…":"Saved")+'</strong></div></header>'+
    '<nav class="tabs" role="tablist">'+tabs.map(t=>
      '<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'
    ).join("")+'</nav>'+
    (S.note?'<div class="note'+(S.noteBad?' note-bad':'')+'" role="status"><span>'+esc(S.note)+'</span><button class="link" data-act="clearnote">Dismiss</button></div>':'')+
    '<main>'+(S.tab==="cycle"?viewCycle():S.tab==="budgets"?viewBudgets():S.tab==="year"?viewYear():viewSetup())+'</main>'+
    '<footer class="foot"><span>Both devices use the same Cloudflare ledger.</span><span><button class="link" data-act="reload">Reload shared data</button></span></footer>';
}

/* ===================== current cycle ===================== */
function viewCycle(){
  const d=currentCycleData();
  const configured=S.config.streams.length||S.config.bills.length||S.config.allowances.length;
  if(!configured){
    return '<div class="empty"><p>Set up your pay schedules, bills, and spending buckets first.</p><button class="btn" data-act="tab" data-v="setup">Go to Setup</button></div>';
  }

  const allEntered=d.pending===0&&d.expected.length>0;
  const label=allEntered?"Safe to transfer now":"Available after this cycle's obligations";
  const note=d.pending>0
    ? '<div class="hero-note warn">'+d.pending+' scheduled paycheck'+(d.pending===1?' is':'s are')+' still not recorded in this cycle. The number will update as income is added.</div>'
    : (d.available>=0
      ? '<div class="hero-note good">All scheduled paychecks for this cycle are recorded. This is the amount available after bills, spending buckets, and your checking cushion.</div>'
      : '<div class="hero-note bad">This cycle is currently short. Keep this amount in checking rather than transferring to savings.</div>');

  const billsRows=d.due.map(x=>
    '<tr><td class="td-date">'+fmtDate(x.date)+'</td><td>'+esc(x.bill.name)+(x.bill.variable?' <span class="badge brass">estimate</span>':'')+'</td><td class="td-num">'+money(x.bill.amount)+'</td></tr>'
  ).join("")||'<tr><td colspan="3" class="muted">No dated bills in this cycle.</td></tr>';

  const bucketRows=S.config.allowances.map(a=>
    '<tr><td></td><td>'+esc(a.name)+' <span class="badge">reserved</span></td><td class="td-num">'+money(a.amount)+'</td></tr>'
  ).join("");

  const recorded=d.pays.slice().sort((a,b)=>parse(b.date)-parse(a.date));
  const recordedRows=recorded.map(p=>
    '<tr><td class="td-date">'+fmtDate(parse(p.date))+'</td><td>'+esc(p.streamName||"Paycheck")+'</td><td class="td-num td-good">'+money(p.amount)+'</td><td class="td-x"><button class="link" data-act="delPay" data-v="'+p.id+'">Remove</button></td></tr>'
  ).join("");

  return(
    '<div class="cycle-strip"><div><span>Current 14-day cycle</span><br><strong>'+fmtDate(d.cycle.start)+' – '+fmtDate(addDays(d.cycle.end,-1))+'</strong></div>'+
      '<div><span>Cycle anchor can be changed in Setup.</span></div></div>'+
    '<section class="panel hero"><div class="hero-label">'+label+'</div>'+
      '<div class="hero-num'+(d.available<0?' short':'')+'">'+money(Math.abs(d.available))+'</div>'+
      '<p class="hero-sub">'+money(d.income)+' income − '+money(d.billTotal)+' bills − '+money(d.bucketTotal)+' spending buckets'+(d.cushion?' − '+money(d.cushion)+' cushion':'')+'</p>'+
      note+
    '</section>'+
    '<div class="cards" style="margin-top:14px">'+
      '<div class="metric good"><div class="metric-label">Income entered</div><div class="metric-num">'+money(d.income)+'</div><p>'+d.pays.length+' paycheck'+(d.pays.length===1?'':'s')+' recorded</p></div>'+
      '<div class="metric bad"><div class="metric-label">Bills this cycle</div><div class="metric-num">'+money(d.billTotal)+'</div><p>'+d.due.length+' scheduled bill'+(d.due.length===1?'':'s')+'</p></div>'+
      '<div class="metric brass"><div class="metric-label">Buckets reserved</div><div class="metric-num">'+money(d.bucketTotal)+'</div><p>Reserved once for the full 14 days</p></div>'+
      '<div class="metric"><div class="metric-label">Checks still expected</div><div class="metric-num">'+d.pending+'</div><p>Based on the pay schedules in Setup</p></div>'+
    '</div>'+
    '<div class="grid">'+
      '<section class="panel"><h2 class="panel-title">Add a paycheck <span>actual amount</span></h2>'+paycheckAdder()+'</section>'+
      '<section class="panel"><h2 class="panel-title">Reserved this cycle</h2><table><tbody>'+billsRows+bucketRows+
        '<tr class="tr-total"><td></td><td>Total reserved</td><td class="td-num">'+money(d.billTotal+d.bucketTotal+d.cushion)+'</td></tr>'+
      '</tbody></table></section>'+
      '<section class="panel"><h2 class="panel-title">Paychecks entered this cycle</h2>'+
        (recordedRows?'<table><tbody>'+recordedRows+'</tbody></table>':'<p class="muted">No paychecks have been entered for this cycle yet.</p>')+
      '</section>'+
      '<section class="panel"><h2 class="panel-title">Why bucket spending does not lower savings twice</h2>'+
        '<p class="muted">The full '+money(d.bucketTotal)+' for Gas, Costco / House, Budgeted Extras, and Food is already held back before the savings number is calculated. Logging a purchase only reduces the amount left inside that bucket.</p>'+
        '<button class="btn btn-light" data-act="tab" data-v="budgets">Open spending buckets</button></section>'+
    '</div>'
  );
}
function paycheckAdder(){
  if(!S.config.streams.length){
    return '<p class="muted">Add at least one pay schedule in Setup first.</p><button class="btn btn-light" data-act="tab" data-v="setup">Go to Setup</button>';
  }
  return '<div class="row">'+
    '<label class="field"><span class="field-label">Paycheck</span><select id="payStream">'+
      S.config.streams.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("")+
    '</select></label>'+
    '<label class="field"><span class="field-label">Date received</span><input type="date" id="payDate" value="'+iso(today())+'"></label>'+
    '</div>'+
    '<label class="field"><span class="field-label">Exact amount received</span><input type="number" step="0.01" inputmode="decimal" id="payAmount" placeholder="0.00"></label>'+
    '<button class="btn" data-act="addPay">Add paycheck to this cycle</button>';
}

/* ===================== spending buckets ===================== */
function viewBudgets(){
  const c=cycleFor(today());
  const statuses=bucketStatus();
  if(!statuses.length){
    return '<div class="empty"><p>No spending buckets are set up.</p><button class="btn" data-act="tab" data-v="setup">Go to Setup</button></div>';
  }

  const cards=statuses.map(s=>{
    const start=Number(s.allowance.amount||0);
    const pct=start>0?Math.max(0,Math.min(100,(s.remaining/start)*100)):0;
    return '<div class="metric '+(s.remaining<0?'bad':'good')+'">'+
      '<div class="metric-label">'+esc(s.allowance.name)+'</div>'+
      '<div class="metric-num">'+money(s.remaining)+'</div>'+
      '<div class="progress"><i class="'+(s.remaining<0?'over':'')+'" style="width:'+pct+'%"></i></div>'+
      '<p>'+money(s.spent)+' spent of '+money(start)+' · resets '+fmtDate(c.end)+'</p></div>';
  }).join("");

  const draws=S.ledger.draws.filter(d=>inRange(d.date,c.start,c.end)).sort((a,b)=>parse(b.date)-parse(a.date));
  const nameOf=id=>{const a=S.config.allowances.find(x=>x.id===id);return a?a.name:"Removed bucket"};

  return '<div class="cycle-strip"><div><span>Spending cycle</span><br><strong>'+fmtDate(c.start)+' – '+fmtDate(addDays(c.end,-1))+'</strong></div>'+
      '<div><span>Purchases reduce the bucket balance, not the savings calculation again.</span></div></div>'+
    '<div class="cards">'+cards+'</div>'+
    '<div class="grid">'+
      '<section class="panel"><h2 class="panel-title">Log spending</h2>'+
        '<div class="row"><label class="field"><span class="field-label">Bucket</span><select id="drawAllow">'+
          S.config.allowances.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join("")+
        '</select></label>'+
        '<label class="field"><span class="field-label">Amount</span><input type="number" step="0.01" inputmode="decimal" id="drawAmount" placeholder="0.00"></label></div>'+
        '<div class="row"><label class="field"><span class="field-label">What for</span><input type="text" id="drawWhat" placeholder="Groceries, gas, Costco…"></label>'+
        '<label class="field"><span class="field-label">Date</span><input type="date" id="drawDate" value="'+iso(today())+'"></label></div>'+
        '<button class="btn" data-act="addDraw">Add spending</button></section>'+
      '<section class="panel"><h2 class="panel-title">Spending this cycle</h2>'+
        (draws.length?'<table><tbody>'+draws.map(d=>
          '<tr><td class="td-date">'+fmtDate(parse(d.date))+'</td><td>'+esc(d.what||"Spending")+'<br><span class="muted small">'+esc(nameOf(d.allowanceId))+'</span></td>'+
          '<td class="td-num">'+money(d.amount)+'</td><td class="td-x"><button class="link" data-act="delDraw" data-v="'+d.id+'">Remove</button></td></tr>'
        ).join("")+'</tbody></table>':'<p class="muted">Nothing has been spent from the current buckets yet.</p>')+
      '</section>'+
    '</div>';
}

/* ===================== year ===================== */
function viewYear(){
  const y=S.year,start=new Date(y,0,1),end=new Date(y+1,0,1);
  const pays=allPaydays(S.config.streams,start,end),bills=billsDue(S.config.bills,start,end);
  const actualPays=S.ledger.paychecks.filter(p=>inRange(p.date,start,end));
  const payMap={},billMap={},actualMap={};
  pays.forEach(p=>(payMap[iso(p.date)]=payMap[iso(p.date)]||[]).push(p));
  bills.forEach(b=>(billMap[iso(b.date)]=billMap[iso(b.date)]||[]).push(b));
  actualPays.forEach(p=>(actualMap[p.date]=actualMap[p.date]||[]).push(p));
  const cycles=cycleStartsIn(start,end);
  const colorFor=id=>COLORS[Math.max(0,S.config.streams.findIndex(s=>s.id===id))%COLORS.length];
  const t=iso(today());

  let html='<section class="panel"><div class="year-head">'+
    '<button class="link" data-act="year" data-v="'+(y-1)+'">← '+(y-1)+'</button>'+
    '<h2 class="year-title">'+y+'</h2>'+
    '<button class="link" data-act="year" data-v="'+(y+1)+'">'+(y+1)+' →</button></div>'+
    '<p class="muted small">Green line = start of a 14-day budget cycle · dots = scheduled paychecks · bars = bills due</p></section><div class="months">';

  for(let mi=0;mi<12;mi++){
    const len=monthLen(y,mi),lead=new Date(y,mi,1).getDay();
    html+='<div class="month"><h3>'+MONTHS[mi]+'</h3><div class="dow">'+DOW.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="days">';
    for(let i=0;i<lead;i++)html+='<span class="day day-blank"></span>';
    for(let d=1;d<=len;d++){
      const k=iso(new Date(y,mi,d)),p=payMap[k],b=billMap[k];
      html+='<button class="day'+(k===t?' day-today':'')+(S.picked===k?' day-picked':'')+(cycles.has(k)?' day-cycle':'')+'" data-act="pick" data-v="'+k+'">'+
        '<span class="day-n">'+d+'</span><span class="marks">'+
        (p?p.map(x=>'<i class="dot" style="background:'+colorFor(x.stream.id)+'"></i>').join(""):'')+
        (b?'<i class="bar"></i>':'')+'</span></button>';
    }
    html+='</div></div>';
  }
  html+='</div>';

  if(S.picked){
    const p=payMap[S.picked]||[],b=billMap[S.picked]||[],a=actualMap[S.picked]||[];
    html+='<section class="panel"><h2 class="panel-title">'+fmtLong(parse(S.picked))+'</h2>'+
      p.map(x=>'<div class="line"><i class="dot" style="background:'+colorFor(x.stream.id)+'"></i><span>'+esc(x.stream.name)+' scheduled</span></div>').join("")+
      b.map(x=>'<div class="line"><i class="bar"></i><span>'+esc(x.bill.name)+'</span><span class="td-num">'+money(x.bill.amount)+'</span></div>').join("")+
      a.map(x=>'<div class="line"><span class="badge good">actual</span><span>'+esc(x.streamName||"Paycheck")+'</span><span class="td-num td-good">'+money(x.amount)+'</span></div>').join("")+
      (!p.length&&!b.length&&!a.length?'<p class="muted">Nothing scheduled or recorded.</p>':'')+
      '</section>';
  }
  return html;
}

/* ===================== setup ===================== */
function viewSetup(){
  const monthlyBills=r2(S.config.bills.reduce((s,b)=>s+Number(b.amount||0),0));
  const bucketTotal=r2(S.config.allowances.reduce((s,a)=>s+Number(a.amount||0),0));

  return '<div class="grid">'+
    '<section class="panel"><h2 class="panel-title">Pay schedules</h2>'+
      (S.config.streams.length?'<table><tbody>'+S.config.streams.map((s,i)=>
        '<tr><td><i class="dot" style="background:'+COLORS[i%COLORS.length]+'"></i></td><td>'+esc(s.name)+'<br><span class="muted small">'+
        (s.type==="biweekly"?'Every 2 weeks from '+fmtLong(parse(s.anchor)):'On the '+s.days.join(" and ")+' of each month')+
        '</span></td><td class="td-x"><button class="link" data-act="delStream" data-v="'+s.id+'">Remove</button></td></tr>'
      ).join("")+'</tbody></table>':'<p class="muted">Add each household paycheck schedule. These are used to show which checks are still expected in a cycle.</p>')+
      '<div class="adder"><div class="row">'+
        '<label class="field"><span class="field-label">Name</span><input type="text" id="nsName" placeholder="Brooke — ASU Prep"></label>'+
        '<label class="field"><span class="field-label">Schedule</span><select id="nsType">'+
          '<option value="biweekly">Every two weeks</option><option value="semimonthly">Twice a month</option></select></label></div>'+
        '<div class="row"><label class="field"><span class="field-label">Recent payday / day 1</span><input type="date" id="nsAnchor" value="'+iso(today())+'"><span class="field-hint">Used for every-two-weeks schedules.</span></label>'+
        '<label class="field"><span class="field-label">Twice-monthly days</span><input type="text" id="nsDays" value="1,15"><span class="field-hint">Used only for twice-a-month schedules.</span></label></div>'+
        '<button class="btn" data-act="addStream">Add pay schedule</button></div></section>'+

    '<section class="panel"><h2 class="panel-title">14-day spending buckets <span>'+money(bucketTotal)+'/cycle</span></h2>'+
      (S.config.allowances.length?'<table><tbody>'+S.config.allowances.map(a=>
        '<tr><td><input class="inline-in" type="text" value="'+esc(a.name)+'" data-act="editAllow" data-v="'+a.id+'" data-f="name"></td>'+
        '<td class="td-num"><input class="inline-in inline-num" type="number" step="0.01" value="'+a.amount+'" data-act="editAllow" data-v="'+a.id+'" data-f="amount"></td>'+
        '<td class="td-x"><button class="link" data-act="delAllow" data-v="'+a.id+'">Remove</button></td></tr>'
      ).join("")+'</tbody></table>':'<p class="muted">No spending buckets yet.</p>')+
      '<div class="adder"><div class="row"><label class="field"><span class="field-label">Bucket</span><input type="text" id="naName" placeholder="Food"></label>'+
      '<label class="field"><span class="field-label">Amount per 14 days</span><input type="number" step="0.01" id="naAmount" placeholder="0.00"></label></div>'+
      '<button class="btn" data-act="addAllow">Add bucket</button></div></section>'+

    '<section class="panel"><h2 class="panel-title">Monthly bills <span>'+money(monthlyBills)+'/mo listed</span></h2>'+
      (S.config.bills.length?'<table><tbody>'+S.config.bills.map(b=>
        '<tr><td class="td-date"><input class="inline-in inline-day" type="number" min="1" max="31" value="'+b.dueDay+'" data-act="editBill" data-v="'+b.id+'" data-f="dueDay"></td>'+
        '<td><input class="inline-in" type="text" value="'+esc(b.name)+'" data-act="editBill" data-v="'+b.id+'" data-f="name">'+
        '<label class="chk"><input type="checkbox" '+(b.variable?'checked':'')+' data-act="editBill" data-v="'+b.id+'" data-f="variable"> estimate</label></td>'+
        '<td class="td-num"><input class="inline-in inline-num" type="number" step="0.01" value="'+b.amount+'" data-act="editBill" data-v="'+b.id+'" data-f="amount"></td>'+
        '<td class="td-x"><button class="link" data-act="delBill" data-v="'+b.id+'">Remove</button></td></tr>'
      ).join("")+'</tbody></table>':'<p class="muted">No bills loaded yet.</p>')+
      '<div class="adder"><div class="row"><label class="field"><span class="field-label">Bill</span><input type="text" id="nbName" placeholder="Rent"></label>'+
      '<label class="field"><span class="field-label">Amount</span><input type="number" step="0.01" id="nbAmount" placeholder="0.00"></label>'+
      '<label class="field"><span class="field-label">Due day</span><input type="number" min="1" max="31" id="nbDay" value="1"></label></div>'+
      '<label class="chk"><input type="checkbox" id="nbVar"> amount varies / estimate</label>'+
      '<button class="btn" data-act="addBill">Add bill</button></div></section>'+

    '<section class="panel"><h2 class="panel-title">Cycle rules</h2>'+
      '<label class="field"><span class="field-label">Start date of any known 14-day cycle</span><input type="date" value="'+S.config.periodAnchor+'" data-act="editRule" data-f="periodAnchor">'+
      '<span class="field-hint">Every budget cycle is counted in 14-day blocks from this date. Pick the first day of one real household budget period.</span></label>'+
      '<label class="field"><span class="field-label">Checking cushion</span><input type="number" step="1" value="'+Number(S.config.cushion||0)+'" data-act="editRule" data-f="cushion">'+
      '<span class="field-hint">Optional amount to keep in checking in addition to bills and spending buckets.</span></label>'+
      '<div class="adder"><button class="btn btn-light" data-act="loadDefaults">Load / restore my listed bills & buckets</button>'+
      '<p class="field-hint">This replaces the current bill and bucket lists with the values from your original budget sheet. Pay schedules and recorded spending are left alone.</p></div>'+
    '</section>'+
  '</div>';
}

/* ===================== events ===================== */
const val=id=>{const e=document.getElementById(id);return e?e.value:""};
const chk=id=>{const e=document.getElementById(id);return e?e.checked:false};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;

  if(act==="tab"){S.tab=v;render();return}
  if(act==="clearnote"){S.note=null;S.noteBad=false;render();return}
  if(act==="reload"){load();return}
  if(act==="year"){S.year=Number(v);S.picked=null;render();return}
  if(act==="pick"){S.picked=S.picked===v?null:v;render();return}

  if(act==="addPay"){
    const amount=Number(val("payAmount")||0);
    if(!(amount>0)){S.note="Enter the actual paycheck amount.";S.noteBad=true;render();return}
    const stream=S.config.streams.find(s=>s.id===val("payStream"));
    S.ledger.paychecks.unshift({
      id:uid("p"),
      streamId:stream?stream.id:null,
      streamName:stream?stream.name:"Paycheck",
      date:val("payDate")||iso(today()),
      amount:r2(amount)
    });
    S.ledger.paychecks=S.ledger.paychecks.slice(0,500);
    commit();return;
  }
  if(act==="delPay"){
    S.ledger.paychecks=S.ledger.paychecks.filter(p=>p.id!==v);
    commit();return;
  }

  if(act==="addDraw"){
    const amount=Number(val("drawAmount")||0);
    if(!(amount>0)){S.note="Enter the spending amount.";S.noteBad=true;render();return}
    S.ledger.draws.unshift({
      id:uid("d"),
      allowanceId:val("drawAllow"),
      date:val("drawDate")||iso(today()),
      amount:r2(amount),
      what:(val("drawWhat")||"Spending").trim()
    });
    S.ledger.draws=S.ledger.draws.slice(0,1200);
    commit();return;
  }
  if(act==="delDraw"){
    S.ledger.draws=S.ledger.draws.filter(d=>d.id!==v);
    commit();return;
  }

  if(act==="addStream"){
    const type=val("nsType")||"biweekly";
    const s={id:uid("s"),name:(val("nsName")||"Paycheck").trim(),type};
    if(type==="biweekly")s.anchor=val("nsAnchor")||iso(today());
    else s.days=String(val("nsDays")||"1,15").split(",").map(x=>Math.max(1,Math.min(31,parseInt(x.trim(),10)||1)));
    S.config.streams.push(s);
    commit();return;
  }
  if(act==="delStream"){
    S.config.streams=S.config.streams.filter(s=>s.id!==v);
    commit();return;
  }

  if(act==="addAllow"){
    S.config.allowances.push({
      id:uid("a"),
      name:(val("naName")||"Budget").trim(),
      amount:r2(Number(val("naAmount")||0)),
      periodDays:14,
      sweep:false
    });
    commit();return;
  }
  if(act==="delAllow"){
    S.config.allowances=S.config.allowances.filter(a=>a.id!==v);
    commit();return;
  }

  if(act==="addBill"){
    S.config.bills.push({
      id:uid("b"),
      name:(val("nbName")||"Bill").trim(),
      amount:r2(Number(val("nbAmount")||0)),
      dueDay:Math.max(1,Math.min(31,Number(val("nbDay"))||1)),
      variable:chk("nbVar")
    });
    S.config.bills.sort((a,b)=>a.dueDay-b.dueDay);
    commit();return;
  }
  if(act==="delBill"){
    S.config.bills=S.config.bills.filter(b=>b.id!==v);
    commit();return;
  }

  if(act==="loadDefaults"){
    S.config.bills=DEFAULT_BILLS.map(b=>({id:uid("b"),name:b[0],dueDay:b[1],amount:b[2],variable:b[3]}));
    S.config.allowances=DEFAULT_BUCKETS.map(a=>({id:uid("a"),name:a[0],amount:a[1],periodDays:14,sweep:false}));
    commit();return;
  }
});

document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const act=el.dataset.act,v=el.dataset.v,f=el.dataset.f;

  if(act==="editRule"){
    S.config[f]=f==="cushion"?Number(el.value||0):el.value;
    commit();return;
  }
  if(act==="editBill"){
    const b=S.config.bills.find(x=>x.id===v);if(!b)return;
    b[f]=f==="variable"?el.checked:(f==="name"?el.value:Number(el.value||0));
    if(f==="dueDay")S.config.bills.sort((x,y)=>x.dueDay-y.dueDay);
    commit();return;
  }
  if(act==="editAllow"){
    const a=S.config.allowances.find(x=>x.id===v);if(!a)return;
    a[f]=f==="name"?el.value:Number(el.value||0);
    commit();return;
  }
});

/* ===================== boot & shared refresh ===================== */
(async function(){
  await load();
  setInterval(async()=>{
    if(S.busy||document.hidden)return;
    const before=S.rev;
    await load(true);
    if(S.rev!==before)render();
  },15000);
})();
</script>
